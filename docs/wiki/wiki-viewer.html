# Full vision is v1 scope — phasing is build order, not a scope cut

## Context

During PRD scoping, the open question was whether to **phase** righthand's vision (pick ONE ops domain for a minimal first release) or **build everything**. The user explicitly said **"build all."**

## Choice

The **entire vision is v1 scope** — Pillars P1–P5, C-AUTHOR, all five ops domains (D1–D5), and D6 research. **Nothing is feature-gated out.**

However, *scope = all* does **not** mean simultaneous delivery. The PRD's **Phasing** section becomes a **build sequence (dependency order)**, not a scope cut. Example: the self-builder (Pillar 5 / [[self-recursive-self-building-agent]]) cannot be built before the command contract (C-AUTHOR) it generates against exists. Everything ships, in dependency order.

## Alternatives considered

- **Single proof domain for a minimal first release** — rejected: the user said "build all."
- **Phased scope gating** (ship a subset now, gate the rest behind a later release) — rejected: nothing is out.

## Rationale

The user's explicit call, not the spec author's default. Recording it prevents future sessions from pruning features as "later / P2" — every part of the vision ships; sequencing is about **build order only**. The build-sequence-vs-scope-cut distinction matters because it reframes "phasing" from "what's deferred" to "what's sequenced."

## Consequences

- No feature is cut for v1; the PRD Phasing section is a **build-sequence plan**, not a scope cut.
- Build order still matters for **dependency** reasons (e.g. C-AUTHOR proven stable before the self-builder targets it).
- The full surface area raises the bar for the first usable release — it is larger than a single-domain MVP by design.

## Status

**Accepted** — scope stance locked by the user ("build all"). The build *sequence* is derived, to be finalized in the PRD Phasing section.

# Bun support is a hard constraint; npm-only distribution

## Context

The user's answer to PRD open question #4 (from
[[technical-approach-proposed-architecture]]) was: *"must support bun."* This
hardens the runtime posture beyond the existing
[[node-typescript-is-the-runtime-for-righthand]] decision (which picked plain
"Node, with TypeScript"). Bun support was previously an *open question*; it is
now a *constraint*. The turn also reframes distribution: Bun gives single-binary
compilation for free, but at a cost (see Consequences).

## Choice

**Target Bun, stay Node-compatible (runtime-agnostic JS).** Distribute via **npm
only** (\`npx righthand\`, \`npm i -g\`); Bun \`--compile\` single-binary distribution
is a **Phase-2 nicety, not the default.**

## Alternatives considered

- **Bun-locked (Bun-only runtime)** — rejected: narrows reach for a tool meant
  to be distributed to others; many users/agents have Node, not Bun.
- **Default to Bun-binary distribution** — rejected: Bun \`--compile\` produces
  **58–109MB binaries** (Bun runtime bundled in). Too heavy as a default
  install story; npm JS on the user's existing runtime is far lighter.

## Rationale

- User explicitly required Bun support.
- Staying Node-compatible maximizes reach while satisfying the Bun requirement
  — runtime-agnostic JS costs little and blocks neither.
- npm distribution is lightweight and universal; the binary path is available
  later without committing to its size penalty now.

## Consequences

- **Every dependency must be Bun-compatible** — this is now a hard selection
  gate. Native modules (e.g. \`keytar\` for OS keychain in the proposed
  credentials layer) are a known risk on Bun and must be verified or swapped
  for a Bun-safe alternative. Flagged as an open risk.
- Distribution model is settled: npm primary. Binary compilation deferred to
  Phase-2.
- Cold-start budget still governed by [[stateless-subprocess-invocation]]
  (righthand is spawned fresh per task); Bun's fast boot helps here but does
  not remove the "keep plugins lazy" rule.

## Status

Accepted — derived from the user's Topic-6 answer #4 ("must support bun").
Extends (does not supersede) [[node-typescript-is-the-runtime-for-righthand]].
Resolves open question #4 on
[[technical-approach-proposed-architecture]].

# citty is the CLI layer

## Decision

**Use [\`citty\`](https://github.com/unjs/citty) (UnJS) as righthand-cli's command-line framework** for parsing, subcommand dispatch, and argument handling — instead of hand-rolling a minimal dispatcher or adopting another CLI library.

Locked in the PRD brainstorm when the user confirmed "citty is okay."

## Context

The [[technical-approach-proposed-architecture]] decision listed the CLI dispatch layer as a choice between *hand-rolling minimal dispatch* or *\`citty\` for free TS-native parsing*. The cold-start and plugin-manifest constraints (JSON-only discovery, lazy handler import, sub-200ms dispatch) made hand-rolled parsing attractive on paper, but every subcommand still needs arg parsing, help text, and type-safe options regardless.

righthand-cli runs on the **Node + TypeScript runtime** ([[node-typescript-is-the-runtime-for-righthand]]); citty is TS-native with first-class type inference, which fits that stack directly.

## Alternatives considered

1. **Hand-roll a minimal dispatcher** — smallest dependency footprint, full control, but re-implements arg parsing + help generation + validation per command. Moves cost from "one dep" to "N commands of bespoke code," and bespoke parsing is a common bug surface.
2. **\`commander\`** — mature, ubiquitous, but JS-first (looser typing) and heavier API surface for a plugin-heavy tool.
3. **\`yargs\`** — feature-rich but historically large and complex for our needs.
4. **\`clipanion\`** — typed and class-based (used by yarn), but heavier mental model than citty's function style.

## Rationale

- **TS-native type inference** — subcommand options are inferred at compile time, matching the project's TS-first runtime and reducing \`as\`/manual typing.
- **Tiny + dependency-light** — aligns with the cold-start budget (R5) and the "fewest deps" instinct; citty is minimal compared to commander/yargs.
- **Function-based, composable API** — fits righthand's plugin model: each plugin command is a small function export, not a class hierarchy.
- **UnJS ecosystem** — well-maintained, stable, commonly paired with TS tooling.
- Resolves the open "hand-roll vs citty" option from [[technical-approach-proposed-architecture]] in favor of reuse over re-implementation (the codebase-already-solves-it / stdlib-first instinct).

## Consequences

- One runtime dependency added to righthand-cli's core.
- Plugin authors author commands in citty's define-command shape (document in the plugin authoring guide).
- Arg parsing/help generation/validation come "for free" — no bespoke code to maintain or test.
- If citty's dispatch proves slower than the cold-start budget allows, the seam (commands as function exports) is narrow enough to swap without rewriting commands.
`,

# CLI framework: citty over crust.js (proposed)

## Context

The user's answer to PRD open question #1 (from
[[technical-approach-proposed-architecture]]) was: *"use citty or
https://crustjs.com/ whichever is better."* This named two candidates and asked
for an informed pick. The choice matters because righthand's plugin system,
JSON-manifest discovery, and MCP-shaped \`tools --json\` surface are **our own
framework-independent design** — so the framework is only the parsing/dispatch/
help layer, and for a product *distributed to others* with *third-party plugin
authors*, **stability is the decisive factor**.

This required real research: **crust.js** is ambiguous (two distinct "crust"
projects exist). The user means **chenxin-yan/crust** (crustjs.com) — a
Bun-native TS CLI framework — **not** the Polkadot blockchain API.

## Choice (PROPOSED — awaiting user confirmation)

**citty** (unjs) as the CLI parsing/dispatch/help layer.

## Comparison (the research that decides it)

| | **citty** (unjs) | **crust** (chenxin-yan) |
|---|---|---|
| Runtime | Node + **Bun** ✅ | **Bun-native** ✅ (Node mostly works) |
| Maturity | **Stable**, battle-tested (UnJS/Nuxt), widely used | **Alpha** (core v0.0.19, <400★, 4mo old, "expect breaking changes before 1.0") |
| Size | zero-dep, tiny | zero-dep, ~3.6kB core |
| Type DX | typed args via inference | **compile-time validation** (catches flag/alias/variadic bugs pre-runtime) |
| Standout modules | just the CLI builder | \`@crustjs/skills\`, \`@crustjs/store\`, \`@crustjs/crust\` (compile → binary) |
| Binary dist | n/a (npm JS) | via Bun \`--compile\` → **58–109MB binaries** |

## Alternatives considered

- **crust.js** — rejected (for now): Bun-native + compile-time validation is
  genuinely nicer author DX, but it is an **alpha dependency** with breaking
  changes promised before 1.0. Unacceptable risk for a shipped product others
  build plugins against. The \`skills\`/\`store\`/plugin modules it offers are ones
  we're building better-fit versions of ourselves anyway, so they don't tip the
  balance. Documented as the documented alternative with a real upside.
- **Hand-roll minimal dispatch** (the Ponytail-lean original proposal) — still
  viable and was the prior default; \`citty\` adds free typed parsing/help at
  near-zero cold-start cost, so it's a net win over hand-rolling.
- **oclif / Nx** — rejected earlier (cold-start weight; dispatch is trivial).

## Rationale

- Satisfies the "must support Bun" constraint (runs on Bun; \`node:util\`
  \`parseArgs\` is Bun-implemented).
- **Stable** — critical when third parties build plugins against righthand and
  when righthand is installed widely.
- Lighter distribution (npm JS on the user's existing runtime) than Bun
  binaries.
- Keeps righthand Node+Bun portable, not Bun-locked → broader reach. See
  [[bun-support-is-a-hard-constraint-npm-only-distribution]].

## Consequences

- Compile-time flag/alias validation (crust's nicest feature) is foregone;
  runtime tests must cover arg parsing instead.
- crust.js stays documented as the alternative; revisit once it hits 1.0 stable.
- This choice is flagged in the PRD as a **key technical decision / risk**.

## Status

**Proposed — NOT yet user-confirmed.** The turn ended with *"Confirm citty (or
override to crust)"*. Pending the user's lock before this graduates to
\`accepted\`. Resolves open question #1 on
[[technical-approach-proposed-architecture]].

type: Decision
title: "Command auto-discovery: one file per command, plugin handlers stay lazy"
description: Context
tags: [c1, discovery, manifest, plugins, cold-start]
status: accepted
timestamp: "2026-07-24T12:21:13.377Z"

# Command auto-discovery: one file per command, plugin handlers stay lazy

## Context

C1 needed a registration model where adding a command requires **no edits to shared files** (manifest/registry/cli), and the lazy-import guarantee must still hold for **plugins** (cold-start-critical), even though bundled core commands can be imported at discovery.

## Choice

- Each core command = ONE file \`src/commands/<name>.ts\` exporting \`descriptor: ToolDescriptor\` + \`run\`.
- \`src/discover.ts\` scans \`src/commands/*.ts\`, dynamically imports each, builds an in-memory table \`{ name, descriptor, run }\`. Built lazily on first access (\`discoverCore()\`, memoized) and awaited by \`manifest.getMergedManifest()\` / \`runtime.dispatch\`.
- Plugin manifest fragments are read as **JSON only** (\`discoverPluginFragments\`); their handler modules are lazy-imported on dispatch via \`loadPluginHandler\`. \`registry.ts\` now just tracks which plugin handlers have actually imported (assertable).
- \`getMergedManifest\` / \`findTool\` became **async** as a result.

## Alternatives considered

- **Top-level await** in discover.ts to keep manifest sync. Rejected: \`node --test\` flags any top-level await anywhere in a test file's import graph as "unsettled" and fails the whole file. Lazy memoized async init avoids that with minimal ripple.
- Hardcoded handler map (the old \`registry.ts\` \`LAZY_HANDLERS\`). Rejected: every new command needed edits to registry + manifest — exactly what we wanted to eliminate.

## Consequences

- Adding a command = drop a file in \`src/commands/\`. \`cli.ts\` still needs a citty subcommand entry to expose it on the CLI surface (that's the one remaining edit — citty owns argv routing).
- The old "dispatching tools doesn't load hello/version" test no longer holds for core commands (they're bundled+imported at discovery). Replaced with a test that a **fake plugin's** handler is not imported by discovery — the lazy guarantee now protects the thing that matters (plugins).

See [[decisions/cli-framework-citty-over-crust-js-proposed]], [[righthand-core-architecture]].

# Diagnostics command — righthand doctor (C10)

## Context

During the PRD interview (Topic 6 — Technical Approach), the user added a new capability to righthand's command surface: **\`righthand doctor\`** — a config/integration diagnostics command. It is the "is my setup healthy?" entry point for a tool that is *distributed to third parties and runs in anyone's repo*, so first-run experience and "works out of the box" are first-class concerns (see [[righthand-cli]]).

This was explicitly **Recorded (C10)** by the user this turn ("1. add righthand doctor … its ok 2. its okay 3. lets go").

## Choice

\`righthand doctor\` runs a battery of health checks and reports status per check. The planned checks (from this turn):

- **LLM provider** — is a provider configured and reachable (OpenAI-compatible / Anthropic / Ollama local)? (supports [[llm-augmented-commands-as-a-first-class-pillar]])
- **Search backend** — is a research/search backend configured and reachable? (supports [[web-research-search-as-a-capability-d6]])
- **CI tokens** — are the credentials the ops wrappers need present (e.g. \`gh\`, cloud CLIs)? (supports the ops-backend stance in [[technical-approach-proposed-architecture]])
- **Plugin health** — are installed plugins loadable / well-formed? (supports [[extensible-plugin-system-is-a-first-class-architectural-pill]])
- **Version** — current installed version + whether it's current.

It follows the standard [[compress-don-t-relay]] output contract: a bounded, schema'd status summary by default.

## Alternatives considered

- **No diagnostics command; users debug setup by hand** — rejected: righthand ships to outside users across arbitrary repos; a "why isn't this working?" probe is essential to adoption and to the [[righthand-cli]] distribution concern.
- **\`doctor\` as a verbose raw log dump** — rejected: it must obey the same compress-don't-relay output contract as every other command.

## Rationale

- Explicit user request this turn; directly serves righthand's distributable-product onboarding friction (a tool nobody can get running in their own repo gets used by nobody).
- Concentrates the "is it working?" question into one command rather than scattering it — pairs naturally with the cross-cutting concerns (LLM, search, creds, plugins, version) the other pillars depend on.

## Consequences

- One concrete, well-scoped command to build early — useful as a first integration target since it exercises config discovery, credential lookup, plugin loading, and the output contract all at once.
- Its check list implicitly locks the **integration surfaces** that must be probe-able: LLM provider, search backend, CI/OS credentials, plugin registry, version.

## Status

**Proposed (capability accepted into scope).** \`righthand doctor\` is in scope as a command; the exact check set + exit-code / \`--json\` schema is to be pinned at spec time. Capability decision; see [[righthand-cli]] for the command index.

  "decisions/distribution-npm-based-for-cli-and-plugins-version-pinned-op.md": `---
type: Decision
title: "Distribution: npm-based for CLI and plugins, version-pinned, opt-in auto-update"

# Distribution: npm-based for CLI and plugins, version-pinned, opt-in auto-update

## Context
righthand ships as an npm CLI ([[stateless-subprocess-invocation]], [[citty-is-the-cli-layer]]) and has a plugin ecosystem that must stay compatible across CLI versions. We need a distribution + update story that is safe (no silent breakage) and simple.

## Choice
- **npm-based distribution** for both the CLI and plugins.
- **\`righthand update\`** command to update the CLI; plugins update via the plugin system.
- **Semver** throughout; plugins are **version-pinned** in the project manifest (no floating latest).
- **Auto-update is opt-in, never silent.**

## Alternatives considered
- Standalone binary distribution — rejected (bun-compile binaries are 58–109MB; tooling alpha-stage); npm is the path.
- Floating plugin versions (latest) — risk silent breakage against a new CLI; pinning prevents it.
- Forced auto-update — hostile to reproducible agent runs; opt-in only.

## Rationale
npm is already the runtime/distribution substrate; reusing it for plugins keeps one mechanism. Pinning + semver gives reproducible, predictable upgrades (critical for an agent tool whose behavior must be stable across runs). Opt-in auto-update respects user control.

## Consequences
- Manifest schema pins plugin versions.
- \`righthand update\` is a v1 lifecycle command.
- Breaking CLI changes require plugin semver coordination.

  "decisions/extensible-plugin-system-is-a-first-class-architectural-pill.md": `---
type: Decision
title: Extensible plugin system is a first-class architectural pillar
description: Context

# Extensible plugin system is a first-class architectural pillar

## Context

The user's third stated want for righthand was: **"easily extensible/modular so
others can build tasks/commands into it as well."** This was not a side request —
it was named alongside "run on node" and "fast" as a core requirement, and the
interviewer flagged it as significant: "it'll shape the command interface,
discovery, and the spec we hand off."

Because [[righthand-cli]] is a standalone, third-party-distributable product
(own repo, installable by outside users), third-party extensibility is core to
its adoption and longevity — not a feature to bolt on after v1.

## Choice

Make a **modular plugin / extension system a first-class architectural pillar**:
third parties can author and register their own tasks/commands that righthand
discovers and dispatches just like built-in ones. Extensibility is a design
constraint from day one, not an afterthought.

## Alternatives considered

- **Monolithic built-in command set** — ship only first-party tasks; no external authoring. Rejected: directly contradicts the user's requirement.
- **Extensibility deferred to later** — build closed first, "add plugins someday." Rejected: retrofitting a plugin seam onto a closed dispatch core is painful and tends to leak internals.

## Rationale

- Explicit user requirement — extensibility was named as a core want, not derived.
- righthand is distributed to others; the value of "the right hand" compounds when the community can grow the task surface beyond what the core team ships.
- Deciding this now (before the spec) means the command interface, the discovery mechanism, and the task-author contract are designed *around* external authors rather than retrofitted.

## Consequences

- The **command interface, plugin discovery, registration, and the task-author contract/spec must all be designed for external authors** — these are now first-class design problems, not follow-ups.
- Tension to manage with the lazy-loading cold-start rule from [[node-typescript-is-the-runtime-for-righthand]]: the discovery layer must find plugins cheaply, but load each one only on demand.
- The spec handed off downstream must include a plugin-author section.

## Status

Accepted — stated by the user during the Phase-2 PRD interview (Q3). Shapes the
spec and everything downstream until superseded.

# General-purpose persona targeting

## Context

PRD-interview persona question (Q5): which user(s) is righthand primarily for? The four candidate personas were indie/hobbyist, pro developer, DevOps/SRE, and general.

## Choice

**righthand targets a general-purpose audience — all four personas matter.** They share one core need (offload non-coding chores from the coding agent), so v1 is not gated on a single persona.

Within that, the **pro developer with real ops tooling is the sharpest design target** — they have the most chore-surface to offload (real CI/CD, logging, releases, issue triage), so when design decisions conflict, optimize for their case as the reference user.

## Alternatives considered

- **Gate v1 on one persona (e.g. indie-only or SRE-only)** — rejected: narrows scope prematurely and excludes users with the same underlying need.
- **All personas equal, no design target** — rejected: no focus point makes prioritization arbitrary and bloats v1 trying to please everyone.

## Rationale

- The core need (hand off the non-coding "rest") is shared across all four; a single persona gate would solve the same problem fewer times.
- Naming a reference persona keeps tradeoffs grounded: when "what would a pro dev with real ops expect?" conflicts with a simpler indie default, the pro-dev answer wins for v1, and the simpler path is a future simplification, not the design center.

## Consequences

- Features serve the shared core need; persona-specific deep-dives wait.
- Pro-dev-with-ops is the default reference user in design/scope debates.
- Onboarding/first-run must still stay low-friction for the general audience (see [[righthand-cli]] distribution concerns).

## Status

Accepted — locked during the PRD interview (Q5). Pro-dev-with-ops is the design target; general-purpose is the audience.

  "decisions/llm-augmented-commands-as-a-first-class-pillar.md": `---
type: Decision
title: LLM-augmented commands as a first-class pillar
description: Context
tags: [architecture, llm, commands, pillars, righthand]
status: accepted
timestamp: "2026-07-24T10:59:58.754Z"

# LLM-augmented commands as a first-class pillar

## Context

The user requested that **the CLI be able to use an LLM when tasks/commands require one.** This was named alongside the existing pillars (run on Node, fast, extensible plugin system) — i.e. a core requirement, not an optional capability.

Some handed-off chores are pure ops ("run this, return the output"), but a meaningful class needs **reasoning over the result**: summarize CI failures, triage logs, draft docs from diffs, classify issues, suggest fixes. A CLI with no LLM can only do the first class; the second is what makes "the right hand" actually useful on messy output.

## Choice

Make **LLM-augmented commands a first-class architectural pillar (Pillar 4):**

- righthand has its **own** LLM provider/config (separate from the main coding agent that hands off to it).
- The command surface splits into two tiers: **"do the ops"** (pure execution) and **"do the ops *and reason about it*"** (ops + an LLM pass over the output).
- An LLM-configured righthand can be invoked mid-task to reason; with no LLM configured, righthand degrades gracefully to pure-ops commands.

This is the **fourth** pillar, after: (1) stateless subprocess invocation, (2) Node + TypeScript runtime, (3) extensible plugin system.

## Alternatives considered

- **LLM on every command (no pure-ops tier)** — rejected: overkill, adds latency/cost to trivial ops, and makes the tool unusable without an LLM configured.
- **No LLM at all (pure ops CLI)** — rejected: directly contradicts the user's stated requirement and leaves the high-value reasoning chores unhandled.

## Rationale

- Explicit user requirement.
- The chores righthand exists to absorb are disproportionately "messy output that needs interpretation"; reasoning is what turns raw ops into an answer the main agent can act on.

## Consequences

- righthand needs a **dedicated LLM config surface** (provider, model, key, maybe per-command overrides) distinct from any caller's config.
- Command authoring/spec must let a command declare "needs reasoning" vs "pure ops."
- Cost, latency, and offline behavior become first-class concerns — a reasoning command must degrade gracefully when no LLM is configured rather than hard-failing.
- Feeds into [[self-recursive-self-building-agent]] (Pillar 5), which is itself an LLM-augmented capability turned on righthand's own surface.

## Status

Accepted — stated by the user; framed as a new pillar during the PRD interview. Shapes the config surface and command-author contract until superseded.

# LLM provider model: OpenAI-compatible base plus native Anthropic

## Context
righthand's LLM-augmented commands ([[llm-augmented-commands-as-a-first-class-pillar]]) and self-builder ([[self-recursive-self-building-agent]]) must talk to many backends: OpenAI, OpenRouter, Ollama, Groq, Together, local/vLLM, and Anthropic. Users need to define their own endpoints and models.

## Choice
- **OpenAI-compatible base provider**, configurable via \`type\`, \`baseURL\`, \`apiKey\`, \`model\`, and params. Covers OpenAI/OpenRouter/Ollama/Groq/Together/local/vLLM — all speak the OpenAI HTTP shape.
- **Native Anthropic provider type** (distinct \`type\`) because Anthropic's API differs from OpenAI's.
- Commands pick a provider **by name** from configured providers; \`baseURL\` and \`model\` are fully user-defined.

## Alternatives considered
- Hard-code a fixed provider — fails the "user-defined endpoints/models" requirement.
- A generic adapter layer per vendor — premature; the OpenAI-compatible shape covers ~6 vendors natively without one.
- Provider SDK lock-in — avoided; configure by base URL instead.

## Rationale
The OpenAI-compatible shape is the de-facto standard most local/hosted servers implement, so one config block covers the majority. Anthropic needs its own type (different API), but that's just two types, not a per-vendor explosion. Name-based selection keeps commands decoupled from transport.

## Consequences
- Config schema carries a \`providers\` map keyed by name.
- Adding a future non-OpenAI, non-Anthropic vendor = a new \`type\`, not a rewrite.

  "decisions/lock-success-criteria-measurable-metrics-never-break-bars.md": `---
type: Decision
title: Lock success criteria — measurable metrics + never-break bars
description: Context
tags: [prd, success-criteria, architecture, acceptance-bar]
status: accepted
timestamp: "2026-07-24T11:15:04.444Z"
---

# Lock success criteria — measurable metrics + never-break bars

## Context

During the PRD interview (Topic 4), the success criteria for **righthand** were locked. The prior [[righthand-problem-research-report]] identified pain points P1–P5 plus a factory-reset/rollback concern (C-RESET). We needed a concrete, opinionated definition of "done" so that success is literally "we killed the pains" — not vibes.

The user authorized an opinionated lock ("you decide"), so rather than ask open-ended, we committed to a specific set.

## The choice (locked)

A success-criteria set with three layers:

**1. Experiential signals**
- 🟢 *Works:* "I stopped babysitting my agent on ops tasks — it hands them off and gets a one-line answer back."
- 🔴 *Broken:* righthand lost data, touched app code unprompted, or the self-builder installed commands I couldn't roll back.
- 🤖 *LLM handoff:* agent runs \`righthand <cmd>\`, gets a small schema'd JSON summary, never reads a raw log or man page into context.

**2. Measurable metrics** (each tagged to the pain it kills)

| Metric | Target | Kills |
|---|---|---|
| Cold-start of \`righthand <cmd>\` | ≤ **200ms** | spawned-per-task perf |
| Output compression vs raw tool output | summary ≤ **20%** of raw tokens, by default | P2/P3 |
| Ops command reliability | ≥ **99%** succeed, no hallucinated flags | P1 |
| Self-builder first-pass success | ≥ **80%** of generated commands install + pass smoke test | P4 |
| Rollback safety | **100%** of changes rollback-able; restore never fails | C-RESET |
| Context saved per ops task | saves the main LLM **≥5k tokens** vs doing it inline | P2/P3 |

**3. Non-functional bars (the never-break lines — locked)**
1. **Never lose user data** — every change journaled before apply; rollback always possible.
2. **Never touch application source code without an explicit command** — righthand operates on its own footprint + ops tooling, not the user's app, unless asked.
3. **Cold-start ≤ 200ms** for any core command (stateless + lazy-loaded plugins).
4. **Credential isolation** — righthand holds its own secrets; never leaks them to stdout/logs/args.
5. **Idempotent & reproducible** — same command + args + env → same result. (kills P5)
6. **Zero-config default** — installs and runs usefully with no config; degrades gracefully when optional integrations (LLM, search, CI tokens) are absent.

## Alternatives considered

- **Leave metrics open / ask the user to fill in.** Rejected — "you decide" authorized an opinionated lock, and vague criteria make specs untestable.
- **Define success per-capability later.** Rejected — a top-level acceptance bar that maps 1:1 to the research pains keeps every downstream spec honest about which pain it serves.

## Rationale

Mapping each metric to a pain point makes success falsifiable: a capability that doesn't move a P-metric isn't pulling weight. The never-break bars are the lines that, if crossed, make the tool untrustworthy regardless of feature completeness (data loss and silent app-code mutation are trust-destroying, not merely inconvenient).

## Consequences

- These targets are **aggressive** and will constrain architecture:
  - Cold-start ≤200ms forces [[stateless-subprocess-invocation]] + lazy plugin loading — no eager import graphs.
  - Output ≤20% tokens is the quantitative backing for the [[compress-don-t-relay]] rule — commands must summarize, not relay.
  - 100% rollback-able + "journal before apply" is a hard requirement on [[self-recursive-self-building-agent]] and every mutating command; it is also the acceptance bar for [[factory-reset-capability-c-reset]].
  - ≥99% reliability + "no hallucinated flags" means commands must validate/parse flags against their manifest, not free-form pass-through.
- Specs and tests should be written against these numbers; a capability that cannot hit its target is out of scope for v1.
- Several bars reinforce existing decisions rather than replace them — they are the *measurable* form of choices already made (statelessness, compression-first, self-builder show-and-confirm).

## Relationships

- [[righthand-cli]] — the product these criteria apply to.
- [[righthand-problem-research-report]] — source of the P1–P5 pains the metrics kill.
- [[stateless-subprocess-invocation]] — underpins the ≤200ms cold-start bar.
- [[compress-don-t-relay]] (rule) — the output ≤20% tokens bar in operational form.
- [[self-recursive-self-building-agent]] — owns the ≥80% first-pass-success target.
- [[factory-reset-capability-c-reset]] — owns the 100% rollback-able bar.
`,
  "decisions/mutating-commands-own-their-journaling-not-a-dispatch-auto-w.md": `---
type: Decision
title: Mutating commands own their journaling (not a dispatch auto-wrap)
description: Context
tags: [c7, journal, rollback, dispatch]
status: accepted
timestamp: "2026-07-24T12:21:28.795Z"
---

# Mutating commands own their journaling (not a dispatch auto-wrap)

## Context

C7 requires every righthand mutation to be reversible via before/after git snapshots keyed by a \`change_id\`. The task suggested dispatch auto-wraps any command with \`descriptor.mutates\` in \`journal()\`. But mutating commands (config set, reset, rollback) must also honor \`--dry-run\` (mutate nothing) and interactive \`--yes\`/confirm — and dispatch can't know those semantics before the command runs.

## Choice

**Mutating commands own their journaling.** \`descriptor.mutates\` stays as a declarative hint (visible in \`tools\`, documents intent) but \`dispatch\` does **not** auto-wrap. Each mutating command calls \`journal(scope, summary, mutate)\` itself around exactly the work it actually performs, after it has resolved scope + checked dry-run/confirm. The returned \`change_id\` is set on \`env.meta.change_id\`.

\`journal()\` flow: ensure footprint dirs + isomorphic-git store → snapshot \`before:<id>\` → run mutate → snapshot \`after:<id>\` → return id.

## Alternatives considered

- **Dispatch auto-wrap on \`descriptor.mutates\`.** Rejected: it snapshots *before* the command decides (via dry-run/confirm) whether to mutate, producing empty/no-op change entries and orphan \`before\` commits on refusals. Also can't pick the correct scope (e.g. \`init\` must target \`project\` even when no project footprint exists yet, which \`resolveActiveScope\` would mis-route to \`user\`).

## Consequences

- \`config set\`, \`init\`, \`reset\`, and \`rollback\` (via \`revertTo\`, which is itself journaled — undo-the-undo) each call \`journal()\` internally.
- History append stays in \`dispatch\` (always-on for recorded dispatches); it reads \`env.meta.change_id\` so the history row links to the change.
- A mutating command that throws mid-mutation leaves an orphan \`before\` commit (no \`after\`); \`listChanges\` filters incomplete pairs, so it never appears as a rollbackable change. Acceptable for v1.

See [[rollback-and-reset-capability-c-reset]], [[decisions/rollback-version-store-isomorphic-git-pure-js-over-system-gi]].
`,
  "decisions/no-build-step-run-typescript-source-directly.md": `---
type: Decision
title: No build step — run TypeScript source directly
description: Context
tags: [architecture, toolchain, typescript, node, bun, build, righthand]
status: accepted
timestamp: "2026-07-24T11:50:40.108Z"
---

# No build step — run TypeScript source directly

## Context

The runtime was locked to Node + TypeScript ([[node-typescript-is-the-runtime-for-righthand]]), but the *build approach* was left open — that decision tentatively named \`tsc\` / \`esbuild\` as the build tooling. During the Phase 0 implementation we wanted the absolute minimum toolchain: no transpile step, no watcher, no emitted \`dist/\`. Node 22+/24 runs \`.ts\` directly via native type-stripping, and Bun (a hard constraint — see [[bun-support-is-a-hard-constraint-npm-only-distribution]]) strips the same way. So a build step is not required for either target.

## Choice

**Run the TypeScript source directly. No build step, no transpiler, no emitted output.** \`bin/righthand.ts\` is executed as-is by Node (and Bun). \`tsc --noEmit\` is used only as an optional *typecheck* gate (not wired into CI yet) — it never emits.

## Alternatives considered

- **\`tsc\` emit to \`dist/\`** — adds a build step, a watcher, a \`dist/\` to gitignore + package, and a "did I rebuild?" failure mode. Tax on every iteration.
- **\`esbuild\` / \`tsup\` bundle** — fast, but still a build step + bundler dependency; overkill for a CLI that imports lazily.
- **\`tsx\` / \`ts-node\` runtime loader** — extra runtime dependency; Node 24's native stripping makes it redundant.

## Rationale

- **Native platform feature over a dependency** (ponytail): Node's type-stripping is built in and zero-config.
- **Instant iteration** — edit \`.ts\`, re-run; nothing to rebuild. Serves the per-task subprocess cold-start loop.
- **Single source of truth** — the file you read is the file that runs; no stale \`dist/\`.
- **Bun-compatible by construction** — Bun strips TS the same way, so the no-build choice also satisfies the Bun hard constraint with zero extra work.

## Consequences

- **Source must stay strip-only-clean.** Only *type-only* syntax is stripped; anything requiring *transformation* breaks at load time with \`ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX\`. Concretely banned: **parameter properties** (\`constructor(public x:)\`), **\`enum\`**, **\`namespace\`**. See [[node-strip-only-typescript-rejects-parameter-properties-enum]] (the gotcha + the \`as const\` pattern we use for \`EXIT\` in \`src/contracts.ts\`).
- \`tsc --noEmit\` becomes a *lint/typecheck* tool, not a build tool.

\`bin/righthand.ts\` runs directly under Node 24 with zero build step; 8/8 \`node --test\` tests green; cold-start 94ms (under the 200ms C1 target).

# Node + TypeScript is the runtime for righthand

## Context

righthand's tech stack was an explicit open question (the \`righthand-cli\` entity
listed it as undecided: Node/TS, Python, Go, Rust all on the table). Runtime
choice is foundational — it constrains the build tooling, packaging, plugin
loading, and the cold-start budget. The user's stated wants were: **"run on node"**,
and **"fast."**

This is not independent of the [[stateless-subprocess-invocation]] model: because
righthand is spawned fresh per task and torn down when it finishes, **cold-start
latency is paid on every single invocation**. The runtime has to boot fast, or
the tool feels slow to the main agent that shells out to it.

## Choice

**Node, with TypeScript.**

## Alternatives considered

- **Python** — rich ecosystem, but slower cold-start and heavier packaging story for a distributable binary/CLI.
- **Go** — fast startup and clean single-binary distribution, but a weaker fit for the dynamic plugin-loading model the user wants.
- **Rust** — best startup/perf, but highest iteration cost and a heavier story for third-party plugin authors.

## Rationale

- The user explicitly asked for Node.
- Node boots fast, and cold-start can be kept **lean via lazy plugin loading** (load a task's code only when that task is invoked) — directly serving the "fast" requirement under the per-task subprocess model.
- TypeScript adds type safety and ergonomics with negligible runtime cost.
- The Node/npm ecosystem serves the distribution + plugin story naturally (installable, discoverable, versioned packages).

## Consequences

- Build tooling is Node/TS (e.g. tsc / esbuild); distribution leans on npm.
- **Plugin loading MUST stay lazy** to honor the cold-start constraint — every eagerly-loaded plugin is a tax on every invocation. This is now a hard design rule, not a nice-to-have.
- All plugin/task author tooling and docs are Node/TS-flavored.

## Status

Accepted — stated by the user during the Phase-2 PRD interview (Q3). Working
baseline until a spec supersedes it. Resolves open question #2 ("language/runtime")
on [[righthand-cli]].

# Plugin sandbox: capability declaration + permission flags, subprocess isolation for untrusted

## Context
[[righthand-cli]] is a distributed plugin host — it runs third-party and LLM-generated commands, so plugin trust varies from trusted-first-party to fully untrusted. This is the top risk (R1/R2) for a subprocess CLI that any coding agent shells out to. We need a v1 security baseline plus a hardening roadmap. Relates to [[extensible-plugin-system-is-a-first-class-architectural-pill]].

## Choice
- **Capability declaration (shared foundation):** every command/plugin declares capabilities in its manifest — \`fs\`, \`network\`, \`exec\`, \`llm-cost\` — plus a \`destructive\` boolean and a \`cost_tier\`.
- **v1 baseline enforcement:** capability-declaration + Node/Bun process permission flags (deny by default; grant per capability).
- **Approval gating:** destructive or high-cost runs require approval (interactive prompt), or \`--yes\` + logged warning in agent/non-interactive mode. Read-only/cheap runs execute freely.
- **v1 roadmap hardening:** subprocess isolation (separate process/seat for untrusted plugins — third-party + LLM-generated).

## Alternatives considered
- Pure allowlist of approved commands only — rejects the self-builder/extensibility narrative (C5/C2).
- Full sandbox-everything-from-day-one (separate process per plugin always) — too heavy for v1 trusted-first-party commands; deferred to hardening.
- No capability model, trust by convention — unacceptable for a host of untrusted code.

## Rationale
Capability declaration is the shared spine: it drives both sandbox enforcement AND approval gating with one mechanism (mirrors what ops MCP servers converged on). Permission flags give v1 teeth without a heavyweight sandbox; subprocess isolation layers on later for the genuinely untrusted set without re-architecting.

## Consequences
- Plugin manifests MUST declare capabilities (contract for [[command-authoring-and-scaffolding]]).
- Self-built ([[self-recursive-self-building-agent]]) commands land in the untrusted set until promoted.
- Agent mode needs a deterministic approval path (\`--yes\`) so non-interactive runs don't hang.

# Project-scoped footprint with config layering

## Context
righthand is per-project: it owns ops work for a given repo with rollback-able state and plugins. It also needs shared identity (credentials) across projects and a way to bootstrap a new project from an existing one.

## Choice
- **Project-scoped footprint** at \`./.righthand/\` is primary: project config, installed plugins, state/history, rollback data.
- **\`~/.righthand/\`** holds shared defaults + credentials (never duplicated per project).
- **\`righthand init --from <other-project>\`** copies config/plugins/state from another project into the current one.
- Config layering with documented precedence: project > user-defaults.

## Alternatives considered
- Global-only state at \`~/.righthand/\` — loses per-project isolation and rollback semantics.
- State in the user's home keyed by path — harder to copy/share/port; no clean \`init --from\`.
- No layering — every project re-declares everything; bad DX.

## Rationale
Per-project footprint gives isolation + portability (the whole footprint is self-contained and rollback-able). Layering with a shared user home avoids credential duplication while keeping project config local. \`init --from\` makes bootstrapping cheap by copying a known-good footprint.

## Consequences
- Config resolution implements documented precedence (project overrides user).
- Credential storage lives ONLY in \`~/.righthand/\` — never written into the project footprint (so the footprint can be shared/committed safely).
- State/rollback ([[rollback-and-reset-capability-c-reset]]) is scoped per footprint.

  "decisions/righthand-core-architecture.md": `---
type: Decision

# righthand core architecture

## Context

Greenfield project at \`E:/righthand.cli\`. Goal (defined in the PRD at \`.prds/righthand-cli/prd.md\`): a CLI that any AI coding agent (Claude Code, Cursor, Copilot/Codex, Aider, pi, etc.) shells out to as a **subprocess per task** to offload all non-coding operational work (CI/CD, logging, docs, tasks, admin, web research), returning a compressed, schema'd result so the agent's context window stays free for writing code.

## Choice

- **Runtime & CLI layer:** Node + TypeScript, targeting **Bun** while staying Node-compatible; **citty** as the CLI layer. Distribute via npm (Bun-binary compilation deferred — 58–109MB too heavy for the default install).
- **Lifecycle:** spawned per task, **stateless per invocation**; cross-task state on disk. No daemon, no live MCP server.
- **Plugin model:** static JSON-manifest fragments, MCP-shaped descriptors; handlers imported lazily (cold-start ≤200ms). 3 tiers: core / user-global / project-local. (Borrows oclif's manifest idea + MCP's descriptor shape, adopts neither framework nor transport.)
- **Ops backend:** wrap existing CLIs (\`gh\`, \`kubectl\`, \`terraform\`, \`aws\`, …) and compress their \`--json\` output. Universal coverage, no vendor-API reimplementation.
- **Rollback:** managed footprint under internal git-semantics store (\`~/.righthand/.git\` + \`./.righthand/.git\`); rollback = revert to prior snapshot. Reuse git, don't invent a VCS.
- **LLM providers:** OpenAI-compatible base (\`type\`, user-defined \`baseURL\`/\`apiKey\`/\`model\`/params — covers OpenAI/OpenRouter/Ollama/Groq/Together/local/vLLM) + native Anthropic; commands pick a provider by name.
- **Self-recursive self-builder:** an LLM writes new commands into righthand (Model A — persisted plugin, show-and-confirm install, project or user location), mandatory smoke-test-before-install, full rollback. Leads the design narrative; built last in the dependency sequence.

## Alternatives considered

- **MCP server** — rejected as primary: market is saturated (~3,700-line awesome-list) and **host-bound** (needs an MCP-aware client + JSON registration). A subprocess CLI is the only model reaching every agent (they all have a shell tool). righthand borrows MCP's *descriptor shape*, not its transport.
- **crust (chenxin-yan/crust)** as CLI layer — rejected over citty: Bun-native and nicer compile-time validation, but **alpha** (<400★, 4mo old, breaking changes expected) — wrong foundation for a distributed product + third-party plugin authors. righthand's plugin system is framework-independent, so crust's \`skills\`/\`store\` modules aren't needed.
- **oclif / Nx** as CLI/plugin framework — rejected: too heavy / wrong abstraction (Nx is build-orchestration, not discrete ops tasks; fights cold-start).
- **Raw CLIs only (no righthand)** — rejected: universal but context-expensive (the documented pain).

## Rationale

The empty quadrant in the landscape = one agent-invoked subprocess CLI that is plugin-extensible, stateless-per-task, owns ops tasks end-to-end, host-agnostic, and zero-config-first. Nothing occupies it. Every choice above maximizes universal reach + stability + reuse of proven mechanisms, and protects the two differentiators (plugin extensibility + the self-builder) with a rollback safety net.

See \`.prds/righthand-cli/prd.md\` for the full PRD and \`research_righthand_problem/research_report.md\` for the evidence base.
`,

# Rollback and reset capability (C-RESET)

## Context

During the PRD interview, the phrase "reset codebase" was ambiguous. The user **clarified it means "rollback from the last changes,"** not a factory nuke of the repo. This refined the C-RESET capability from "wipe everything" to **rollback-first**, with factory reset demoted to the extreme escape hatch.

C-RESET was framed as the **universal safety net** that closes Topic 3 (Scope & Boundaries): scope is "all in, nothing out," delivered in dependency order, with rollback/factory-reset underneath everything. It pairs directly with [[self-recursive-self-building-agent]] — *the LLM can write code into righthand, and you can always roll it back* — which is what makes the self-builder safe to ship.

## Choice (scope refined + locked; implementation mechanism proposed, not yet confirmed)

**Scope — locked (user clarification this turn):**

- **Rollback (primary):** undo the last change(s) righthand made — a generated plugin install, a config edit, a state mutation, a self-builder generation. Granular surfaces:
  - \`righthand rollback\` — revert the last change
  - \`righthand rollback --steps N\` — revert the last N changes
  - \`righthand rollback <change-id>\` — revert one specific change
- **Factory reset (the extreme):** wipe righthand's *entire managed footprint* (config, plugins, state, history) back to fresh-install. **Preserves application code always.**
- **Safety guarantees (locked):** app code is never touched without an explicit command; every write is journaled/snapshotted **before** it is applied; \`--dry-run\` previews a rollback.

**Implementation mechanism — proposed (lean for the Technical Approach section), NOT user-confirmed:**

- righthand journals/snapshots every change to its managed footprint *before* applying it; rollback = revert to the prior snapshot.
- Recommended: **borrow git semantics** (keep righthand's footprint under an internal version store) rather than invent a custom VCS. This is a *recommendation*, awaiting user confirmation.

## Alternatives considered

- **Factory nuke as the primary meaning of "reset"** — rejected by the user's clarification: the intent was granular rollback, not a wholesale wipe.
- **Invent a custom change-tracking/VCS scheme** — rejected as the recommendation: a git-style version store reuses proven semantics and is less to build than a bespoke journal+revert engine. (Noted as proposed; final call pending.)
- **Per-caller guards instead of journaled writes** — rejected: journaling once at the write boundary is the smaller, root-cause fix and makes rollback universally available, vs. teaching every caller to be reversible.

## Rationale

- The user's clarification was the explicit driver: rollback is primary, factory reset is the escape hatch.
- App-code-preservation + journaled-before-apply are the non-negotiables that make the self-builder (Pillar 5) safe — without a reliable undo, letting an LLM write into righthand is too risky to ship.
- "Borrow git semantics over a custom VCS" is the lazy/reuse-first recommendation (don't reinvent version control).

## Consequences

- Every write path in righthand (plugin install, config edit, state mutation, self-builder generation) **must journal a snapshot before applying** — this is now a cross-cutting requirement, not an afterthought.
- App code is inviolable by rollback/reset by design; factory reset touches only righthand's managed footprint.
- Pairs with [[self-recursive-self-building-agent]]: rollback is the safety net that justifies letting the LLM modify righthand.
- Still open: (1) user confirmation of the **git-semantics / internal version store** mechanism vs. a custom one; (2) the exact snapshot/journal storage format and location; (3) change-id scheme.

## Status

**Proposed (scope refined + locked; mechanism proposed).** Scope (rollback primary + factory-reset secondary, granular, app code preserved) and safety guarantees (journaled-before-apply, \`--dry-run\`) are **locked by the user's clarification this turn**. The implementation mechanism (git-style internal version store over custom VCS) is the assistant's **recommendation**, not yet user-confirmed — resolve before spec. This is a capability decision; see [[righthand-cli]] for the full capability index.
`,

type: Decision
title: "Rollback version store: isomorphic-git (pure-JS) over system git or a custom VCS"
description: Context
tags: [architecture, rollback, version-store, git, isomorphic-git, c7, dependency]
status: proposed

# Rollback version store: isomorphic-git (pure-JS) over system git or a custom VCS

## Context

The [[rollback-and-reset-capability-c-reset]] decision locked *rollback-first scope* (app code preserved, journaled-before-apply, \`--dry-run\`) but left the **implementation mechanism proposed and unconfirmed**, with three open questions: (1) git-semantics store vs a custom VCS, (2) the snapshot/journal storage format and location, (3) the change-id scheme. [[righthand-core-architecture]] later accepted "managed footprint under an internal git-semantics store; reuse git, don't invent a VCS" — but did not name *which* git implementation.

The Phase 0 spec \`.specs/rollback-reset/spec.md\` (C7) concretizes all three open questions. This decision records the key, non-obvious call: **which git implementation backs the version store**.

## Choice (proposed in the C7 spec)

- **Version store implementation: \`isomorphic-git\`** (pure-JavaScript git). **No dependency on a system-installed \`git\` binary.**
- **Snapshot granularity: the whole managed footprint, per change.** Simplest correct strategy — the footprint is small (config, manifest, plugins, history), so per-file diffing isn't worth the complexity. Each change produces a before + after commit.
- **Rollback is itself journaled ("undo-the-undo"):** reverting a change writes its own snapshot/change_id, so a rollback is itself reversible. Keeps the "you can always undo it" philosophy symmetric.
- **change_id = ULID**, carried in the output envelope \`meta.change_id\` and the history log, linking the C7 version store ↔ the C9 history log ↔ the command envelope (see [[command-output-envelope-and-exit-codes]]).
- **v1 ships undo-manifest *creation*** (snapshot + change_id on every mutation); \`righthand restore\` (replay/re-apply a prior change) is a **proposed follow-up**, not v1.

## Alternatives considered

- **Shell out to the system \`git\` binary** — rejected: requires \`git\` installed on the host (not guaranteed in sandboxes/containers/CI runners that don't bake it in); adds a hard external dependency and cross-platform process/path overhead. isomorphic-git removes that dependency entirely.
- **A heavier native git library (e.g. nodegit)** — rejected: native bindings break the "runs identically on Bun + Node, cross-platform, no compilation" constraint ([[bun-support-is-a-hard-constraint-npm-only-distribution]]).
- **Custom journal + revert engine** — rejected (already): reinventing version control; more to build and verify than reusing proven git semantics ([[rollback-and-reset-capability-c-reset]]).

## Rationale

isomorphic-git is the realization of "reuse git, don't invent a VCS" with the **fewest external dependencies**: pure JS, no system binary, no native compile, identical behavior on Bun and Node. Whole-footprint snapshots trade a little disk for a lot of simplicity (no per-file diff bookkeeping) — the right lazy trade at this footprint size. Journaled rollback preserves the safety philosophy symmetrically.

## Consequences

- Resolves the three open mechanism questions on [[rollback-and-reset-capability-c-reset]]; that decision's "proposed, not user-confirmed" mechanism is now concretized (still **proposed** pending the user's Phase-0 review).
- Adds \`isomorphic-git\` as a runtime dependency.
- Every mutating write path must snapshot-before-apply + mint a ULID change_id.
- \`righthand restore\` (replay) is explicitly deferred to a follow-up.
`,

# Self-builder safety: auto smoke test gates every generated command before install

## Context
The self-builder ([[self-recursive-self-building-agent]]) grows righthand's command surface by generating new commands via an LLM. Generated code is untrusted by definition and lands in the untrusted plugin set (see the plugin sandbox decision). We need a safety gate so broken/malformed commands can't install silently.

## Choice
- **Per-command smoke test (install gate):** every generated command must pass an auto-generated smoke test — a dry-run against its declared \`inputSchema\` — before it is installed.
- **Builder-level golden-set eval:** a curated golden-set eval suite for the self-builder itself, measuring generation quality over time.

## Alternatives considered
- Trust generated code, ship immediately — unacceptable; untrusted code path.
- Manual review gate only — defeats the self-building/automation narrative.
- Full static analysis suite at install — over-engineered for v1; dry-run smoke test is the minimum viable gate.

## Rationale
A dry-run against the declared schema is the smallest check that fails if the command is structurally broken — it gates install without heavy infra. The golden-set eval keeps builder quality observable and regressable. Together they let the self-builder stay automatic without becoming a footgun.

## Consequences
- Command manifest MUST declare \`inputSchema\` (contract for [[command-authoring-and-scaffolding]]).
- Install path runs the smoke test; failures block install and report to the user.
- Generated commands remain in the untrusted sandbox tier until promoted.

# Self-recursive self-building agent

## Context

The user wants: **with an LLM configured, a user can tell righthand's LLM what features it wants, and the LLM then builds those features into righthand itself.** righthand becomes its own developer — a **self-recursive / self-building agent**.

This was flagged as the **riskiest, most novel pillar (Pillar 5).** It interacts tightly with [[extensible-plugin-system-is-a-first-class-architectural-pill]] — the self-builder is effectively the ultimate plugin author.

The broader generation mechanism is **not yet fully pinned down** (see Status), but its two safety-rail sub-questions were **resolved in Q5c** (see below).

## Choice (as a goal — mechanism narrowed, not fully locked)

righthand can **grow its own command surface via its LLM.** Three design models are on the table:

- **Model A — Persistent plugin generation (most ambitious):** the LLM writes real code — a new plugin/command file — saves it to disk, registers it in the manifest, and it becomes a first-class reusable command forever after. righthand literally grows new capabilities.
- **Model B — One-off ad-hoc tasks:** the LLM reasons + calls existing tools to accomplish the ask *this once*, but persists no new command. "Build me a feature" really means "do this thing for me now."
- **Model C — Hybrid (propose → diff → approve → install):** the LLM proposes new command code, a human reviews/approves the diff, then it's registered and run.

### Two safety-rail sub-questions — RESOLVED (Q5c, 2026-07-24)

1. **Auto-run vs. approve → RESOLVED: show-and-confirm before install.** Generated command code is shown to the human and confirmed **before** it is installed and made runnable — it is **never** auto-installed/auto-run. This rejects auto-run (the highest-risk option) and aligns with the **Model C** propose → diff → **approve** → install flow. Fast, but not invisible.
2. **Where generated code lives → RESOLVED: both locations, picked at generation time.** Generated code may target either **project-local** (in-repo, version-controlled) or **user-global** (\`~/.righthand/plugins/\`, shared across projects); the choice is made **per-generation**, not locked to one fixed root or a global default.

## Alternatives considered

- **Defer / drop the self-builder entirely** — rejected: it is an explicit user requirement and the most novel differentiator; it should at least be scoped, not silently dropped.
- **Commit to Model A (auto-run) now** — rejected: auto-installing LLM-generated code is a trust/safety decision, and the user explicitly chose show-and-confirm-before-install (Q5c), ruling out auto-run for v1.

## Rationale

- Explicit user requirement, and the single most differentiating feature vs. ordinary ops CLIs.
- The approval stance was the **user's explicit call (Q5c)**, not the spec author's default — the safe option was chosen deliberately. Recording it here means the generation→install flow must ship with a confirm gate, not grow one later.

## Consequences

- With the approval stance and code location resolved, the spec **can now define** the generation → show → confirm → install flow and the dual-target (project-local / user-global) storage path.
- The generation flow **must include a show-and-confirm gate before install**; auto-install/auto-run of LLM-generated code is out for v1.
- Storage **must support both project-local and user-global targets**, chosen at generation time (not a single fixed root).
- Still open: the precise generation **model** (A persistent vs B ad-hoc vs C hybrid) — narrowed toward C by the approval gate, but not formally locked.
- Whatever the model, it builds on [[extensible-plugin-system-is-a-first-class-architectural-pill]] (generated commands are plugins) and [[llm-augmented-commands-as-a-first-class-pillar]] (the builder is itself an LLM-augmented capability).

## Status

**Proposed (partially resolved).** Requirement accepted. **Approval stance = show-and-confirm-before-install** and **code location = both, picked at generation time** are **locked (Q5c, this session)**. The generation model (A/B/C, narrowed toward C) remains open — resolve before spec.
`,

# Subprocess-per-task invocation: righthand is stateless, not a daemon

## Context

righthand is a CLI that a main coding LLM shells out to in order to offload
non-coding tasks (admin, CI/CD, docs, task tracking, etc.). An open design
question was: **how does the LLM talk to righthand, and how long does a
righthand process live?** This is foundational — it determines where state can
live and how the whole system is built.

## Choice

The LLM invokes righthand **as a subprocess via the terminal** for each task
(\`righthand <command> ...\`). The process is **spawned when a task starts and
torn down when the task finishes**. righthand is therefore **stateless per
invocation** — it is NOT a long-running daemon or background server.

## Alternatives considered

- **Long-running daemon/server** the LLM connects to over a socket / IPC, holding
  cross-task state in memory.
- **In-process library** linked into the main agent's runtime.

## Rationale

- Simplest possible invocation and teardown — no lifecycle management of a
  background process, no port/socket discovery the agent has to coordinate.
- Clean failure isolation: each task gets a fresh process; a crash in one task
  can't corrupt another's state in memory.
- Matches the "always-available CLI" identity already on record for
  [[righthand-cli]].

## Consequences

- **Any state that must survive across tasks — task history, progress, config,
  accumulated results — CANNOT live in process memory.** It must persist to disk
  (files or a DB) and be reloaded on every invocation.
- This shapes the storage and state-management design for the entire project:
  every piece of cross-task continuity is a persistence problem, not a global
  variable.
- Startup cost per task is paid every time, so cold-start latency matters (keep
  it fast).

## Status

Stated by the user during the Phase-1 PRD brainstorm as the current invocation
model. Treat as the working architectural baseline until a spec supersedes it.

# Technical approach — proposed architecture

## Context

Topic 6 (Technical Approach) of the PRD interview. The assistant made **opinionated calls grounded in the prior research** ([[righthand-problem-research-report]]) and the Ponytail reuse-first principle, presenting a complete proposed architecture for how righthand is built. The user has **not yet confirmed** it — the turn ended with **4 explicit open questions** ("answer these 4, or say 'your calls' to lock all recommendations"). This ADR captures the proposed direction + rationale + the open questions so future sessions have it even before final sign-off.

## Choice (PROPOSED — pending user confirmation on 4 calls)

Layer-by-layer proposed decisions:

| Layer | Proposed decision | Rationale |
|---|---|---|
| **CLI framework** | Hand-roll minimal dispatch (or \`citty\` for free TS-native parsing) — *not* oclif/Nx | Dispatch is trivial; frameworks add cold-start weight. Keep righthand thin. |
| **Ops integrations** | **Shell out to existing CLIs** (\`gh\`, \`kubectl\`, \`terraform\`, \`aws\`, \`flyctl\`…) as the universal backend, then **compress their \`--json\` output** | Universal + zero-reimplementation. Plugins can add direct-API backends later. Reinforces [[compress-don-t-relay]]. |
| **State + rollback** | righthand's managed footprint lives under an **internal git repo** (\`~/.righthand/.git\` + \`./.righthand/.git\`); rollback = git operations | Reuse proven versioning instead of inventing a VCS. **This is the implementation mechanism for** [[rollback-and-reset-capability-c-reset]] (previously noted there as a recommendation). |
| **Config** | layered: project \`./.righthand/config.json\` → user \`~/.righthand/config.json\` → env vars (env wins) | Standard precedence; zero-config default degrades gracefully. |
| **Credentials** | **OS keychain** (keytar) where available → env var fallback → never plaintext files, never stdout/logs/args | Security bar. |
| **Distribution** | **npm primary** (\`npx righthand\`, \`npm i -g\`); standalone binary (single-file bundle) as Phase-2 nicety | Node-native install; reach every agent via \`righthand\` on PATH. |
| **LLM provider** (Pillar 4) | **Provider abstraction**: OpenAI-compatible (covers OpenAI, Ollama, OpenRouter, most local) + native Anthropic; model + key in config/env | Covers the vast majority of setups with one abstraction. See [[llm-augmented-commands-as-a-first-class-pillar]]. |
| **Search backend** (Pillar 3/C6) | **Pluggable**, default to an agent-friendly paid API (**Tavily** or **Brave**) with a free fallback (**SearXNG** self-hosted / **DuckDuckGo** html) | Deep research needs a real backend; zero-config fallback for no-key users. See [[web-research-search-as-a-capability-d6]]. |

The **already-locked foundations** (Node+TS runtime, plugin model = static JSON manifest fragments / MCP-shaped descriptors with handlers imported on invocation, \`righthand tools --json\` MCP tool-descriptor surface, bounded-schema'd output contract, spawned-per-task stateless lifecycle) are recorded in their own ADRs ([[node-typescript-is-the-runtime-for-righthand]], [[extensible-plugin-system-is-a-first-class-architectural-pill]], [[stateless-subprocess-invocation]]) and are **not** re-decided here.

## Alternatives considered

- **Adopt a CLI framework (oclif/Nx)** — rejected: cold-start weight; dispatch is trivial.
- **Call vendor APIs directly instead of wrapping CLIs** — rejected: massively more code; loses universal coverage. Trade-off: depends on those CLIs being installed (open question #3).
- **Invent a custom change-tracking/VCS** — rejected: git-style internal store reuses proven semantics (also recorded in [[rollback-and-reset-capability-c-reset]]).
- **Bun runtime / native modules concerns** — explicitly surfaced as open question #4 (any hard constraints to honor).

## Rationale

- Reuse-first (Ponytail): wrap proven CLIs, borrow git semantics, lean on npm + OS keychain — build the minimum that covers the space.
- The provider + search abstractions deliberately cover the vast majority of real setups with one implementation each, with zero-config fallbacks so the distributable tool works for no-key users (see [[righthand-cli]] onboarding concern).

## Consequences / open questions (the 4 calls — all UNRESOLVED as of this turn)

1. **CLI framework** — hand-roll minimal, or adopt \`citty\`? (lean: hand-roll for cold-start; \`citty\` is tiny + free help/parsing.)
2. **Search backend default** — Tavily / Brave / Serper / self-hosted SearXNG / DuckDuckGo? Sets C6's out-of-box behavior.
3. **Ops backend stance** — confirm **wrap existing CLIs** over calling vendor APIs directly (trade-off: depends on those CLIs being installed).
4. **Hard tech constraints** — e.g. must support Bun, no native modules (keytar is native), air-gapped, "avoid framework X"?

## Status

**Proposed — NOT user-confirmed.** All 8 layer decisions and the 4 open calls are pending the user's response (or a "your calls" lock). Resolve before spec. Once confirmed, the locked layers should graduate to their own focused ADRs (or this one flips to \`accepted\`) and the open questions close.

# Web research / search as a capability (D6)

## Context

The user stated a new requirement: **"the cli can do research or search the web when needed."** They pointed at two reference skills as the methodology to match:

- \`E:\\skills.te9.dev\\web-research\` — **shallow**: decompose into subtopics → fan out parallel searches → write findings to files → synthesize. Fast, good for "look this up."
- \`C:\\Users\\PTW\\.pi\\agent\\skills\\websearch-deep\` — **deep**: 6-phase (problem decomposition → multi-query generation, 3–5 variations per sub-question, parallel batches → evidence synthesis with source ranking by credibility/freshness/relevance → numbered clickable citations → structured 250–350 line report → iterative refinement). Good for "decide this architecture."

Tasks handed to righthand sometimes need external knowledge (current best practices, library options, API facts, status pages) that the main coding agent would otherwise pull into its own context window to gather.

## Choice

Add **web research / search as a capability (D6)** to righthand's scope, supporting **two flavors**:

- **Shallow research** — subtopic decomposition + parallel search + synthesis. The "look this up" path.
- **Deep research** — the full 6-phase pipeline with source ranking and a structured cited report. The "decide this" path.

righthand performs the searching and synthesis itself and returns a compressed, cited summary — the noisy gathering and reading stays out of the caller's context window.

This slots into the scope picture as a **Phase 2** capability: it **depends on Pillar 4 ([[llm-augmented-commands-as-a-first-class-pillar]])** — synthesis needs an LLM, so research lands wherever the LLM pillar does.

## Alternatives considered

- **No web research — main agent searches itself** — rejected: contradicts the user's explicit requirement and burns the main agent's context window on gathering, the exact noise righthand exists to absorb.
- **Shallow-only** — rejected as the sole mode: the user pointed at a deep-research skill explicitly, signalling both "look up" and "decide this" are wanted.
- **Built-in search provider** (hardcode one engine) — deferred: see open question below; a pluggable backend is more in line with the [[extensible-plugin-system-is-a-first-class-architectural-pill]] pillar.

## Rationale

- Explicit user requirement.
- Reinforces righthand's core thesis: *keep noisy, context-heavy work out of the main LLM's window.* Web gathering is among the noisiest work there is.
- Two existing, proven methodologies were handed to us — no need to invent the approach, only to implement it as a command/capability.

## Consequences

- **Search backend must be chosen** — open question for the Technical Approach section. Candidates: SearXNG (self-hostable), DuckDuckGo, Brave Search API, Tavily, Serper, etc. Choice trades off self-hostability / privacy / cost / result quality.
- **Phasing dependency**: D6 is gated on P4 (LLM config). If P4 is Phase 2, D6 is Phase 2.
- Deep research writes a structured, cited report — this reuses the same "return compressed/summarized output" contract described in the compress-don't-relay principle.
- Feeds the [[self-recursive-self-building-agent]] capability (Pillar 5): a self-building righthand can research how to build its own new features.

## Status

Accepted as a scope capability (stated requirement). Phasing (Phase 2, behind P4) and search-backend selection remain open. Shapes the command surface and config (LLM provider + search provider) until superseded.

# Bun --compile binaries are 58–109MB; crust.js is alpha-stage

Two non-obvious facts surfaced while evaluating the CLI framework (see
[[cli-framework-citty-over-crust-js-proposed]]) and runtime/distribution
([[bun-support-is-a-hard-constraint-npm-only-distribution]]) for righthand:

## Bun \`--compile\` produces 58–109MB binaries

Single-file binary compilation (Bun's selling point for CLI distribution)
bundles the entire Bun runtime into the executable, landing at **58–109MB**
per binary. This is far heavier than the typical npm-JS install story. Decision
impact: default to **npm distribution**, treat Bun-binary compilation as a
Phase-2 nicety only. Revisit if binary size improves or per-platform stripping
becomes practical.

## crust.js (chenxin-yan/crust, crustjs.com) is alpha

Not to be confused with the Polkadot blockchain "crust" API. The CLI framework
is at **core v0.0.19, <400★, ~4 months old**, with an explicit "expect breaking
changes before 1.0" warning. It is genuinely Bun-native and offers compile-time
flag/alias validation (nicer DX than citty's runtime inference), plus modules
for agent-skill gen, typed persistence, and compile-to-binary. But its maturity
makes it an unsuitable dependency for a shipped product others build plugins
against. Revisit once it hits stable 1.0.

**When this matters:** any future session considering Bun-binary distribution
or re-evaluating crust.js as the CLI framework.

# Cold-start ~177ms after discovery; isomorphic-git kept off the cold path

After wiring auto-discovery (9 core command files, each importing its deps), \`righthand tools\` subprocess cold-start rose from the **94 ms** baseline (3 commands) to **~177 ms warm** (runs 170–192 ms across 5 samples) on Node 24. Still under the 200 ms C1 budget, but the headroom shrank.

**The cost is real and expected:** discovery now dynamically imports all 9 command modules + their transitive graph (\`config\`, \`footprint\`, \`journal\`, \`versionstore\`, \`ulid\`, \`confirm\`) at startup.

**The thing that matters held:** \`isomorphic-git\` (the only heavy dep, 55 packages) is **NOT** on the cold path. Verified by checking the require cache after importing the full discovery graph — isomorphic-git is absent. It's lazy-imported inside \`versionstore.ts\` functions (\`await import("isomorphic-git")\`), so importing the module is free; only a mutating command that actually touches the store pays for it.

**Lever if budget tightens later:** the manifest-merge loads every command module. If cold-start regresses past 200 ms, the move is to defer importing mutating command modules (config/init/changes/rollback/reset) until dispatched — i.e. split discovery into "descriptors eagerly" vs "run handlers lazily". Not needed yet.

Data point collected 2026-07-24, Node 24.15.0, Windows.

type: Learning
title: expensive commands can't show-then-confirm via dispatch — the approval gate preempts run()
description: "When a command sets \`costTier: "expensive"\` (or \`destructive: true\`), the dispatch-level approval gate in \`src/runtime.ts\` / \`src/capabilities.ts#requiresApprov"
tags: [dispatch, capabilities, self-builder, c5, approval-gate, righthand]
timestamp: "2026-07-24T13:01:33.271Z"
---

# expensive commands can't show-then-confirm via dispatch — the approval gate preempts run()

When a command sets \`costTier: "expensive"\` (or \`destructive: true\`), the dispatch-level approval gate in \`src/runtime.ts\` / \`src/capabilities.ts#requiresApproval\` fires **before** \`run()\` executes: without \`--yes\` (or \`config.permissions.auto_confirm_destructive\`), dispatch returns \`needs_human\` exit 3 and the handler never runs.

This means a command that wants to **generate something, show it, then ask "install? [y/N]"** cannot do so through the normal dispatch path if it is declared expensive — the gate blocks it before it can produce anything to show. The C5 self-builder (\`righthand build\`) hits exactly this: it is \`costTier: "expensive"\` (it spends LLM tokens + writes code to disk), yet PRD C5 wants a show-then-confirm flow.

Resolution taken (no edit to runtime.ts/capabilities.ts was allowed this round):
- The dispatch approval gate IS the primary confirm for \`build\` — \`righthand build "..."\` without \`--yes\` → needs_human exit 3. Re-run with \`--yes\` to apply.
- \`buildCommand()\` in \`src/selfbuilder.ts\` keeps its OWN step-5 confirm (\`if (!input.yes)\` → needs_human + code in result) so the show-code path is still reachable when \`auto_confirm_destructive: true\` bypasses the dispatch gate but \`--yes\` was not passed.
- \`--dry-run\` (review without install) requires \`--yes\` to clear the gate too: \`righthand build "..." --yes --dry-run\`.

Implication for any future "show-then-confirm expensive command": either (a) accept the gate as the confirm (current), (b) make it NOT expensive/destructive and self-confirm like \`new\`/\`reset\`/\`rollback\` (those set neither — see the comment in \`src/capabilities.ts\`), or (c) relax the gate to skip \`--dry-run\` invocations (would require editing \`requiresApproval\` / dispatch).

# net:llm capability gate: llm commands are denied before run() unless allowed

The \`llm\` command (and any future \`righthand\` command) declares \`capabilities: ["net:llm"]\` in its descriptor. Dispatch (\`src/runtime.ts\`) runs \`checkCapabilities()\` against \`config.permissions\` **before** the handler:

- If \`permissions.allow\` does **not** contain a matching pattern (\`net:llm\`, \`net:*\`, or \`*\`), dispatch short-circuits to \`exit 6\` (\`EXIT.CAPABILITY_DENIED\`) with a \`needs_human\` message — \`run()\` is **never called**, so the AUTH(4)/no-provider logic inside the command never runs.
- Only when \`net:llm\` is granted does \`run()\` execute; then a missing/unresolvable provider or key surfaces as \`exit 4\` (\`EXIT.AUTH\`).

**Implication for testing**: to exercise a command's own error paths (e.g. "no provider → AUTH 4") through \`dispatch()\`, the test config must grant the capability (\`config.permissions.allow = ["net:llm"]\`). Tests that call \`complete()\` / \`run()\` directly bypass the gate and don't need it.

**Also**: \`complete()\` takes \`opts.fetchFn\` as a test seam — inject a fake fetch returning a canned OpenAI/Anthropic-shaped body; **no real network** in the suite. The command layer uses the global \`fetch\` (patch \`globalThis.fetch\` for an end-to-end dispatch test).

# Node strip-only TypeScript rejects parameter properties, enums, and namespaces

When running \`.ts\` files directly on **Node 22+/24** (native type-stripping) — and on **Bun**, which behaves the same way — only *type-only* syntax is stripped. Several TypeScript features require **transformation** (not stripping) and throw \`ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX\` at load time:

- ❌ **Parameter properties** — \`constructor(public x: number)\` → must be explicit: declare the field, assign in the body.
- ❌ **\`enum\`** declarations → use a plain \`const\` object + \`as const\` (we do this for \`EXIT\` exit codes in \`src/contracts.ts\`).
- ❌ **\`namespace\`** → use modules.
- ❌ **Parameter decorators / legacy decorator property emit** that changes runtime semantics.

Type-only constructs are fine: interfaces, type aliases, generics, \`import type\`, type assertions (\`as\`), \`as const\`, \`satisfies\`.

**Why it matters here:** righthand targets Bun with Node fallback and runs \`.ts\` directly with **no build step** (a deliberate ponytail choice — native platform feature, zero transpiler dependency). So the source must stay strip-only-clean. \`src/errors.ts\`'s \`CommandError\` was the first thing to trip this; fixed to explicit fields.

**Test runner:** \`node --test\` (no path arg) auto-discovers \`test/**/*.test.ts\`; \`node --test test/\` fails on Windows with \`Cannot find module 'test'\`. \`package.json\` \`test\` script is \`node --test\`.

**Cold-start data point (2026-07-24):** \`righthand tools\` end-to-end subprocess cold-start measured **94ms on Node 24** — already under the 200ms C1 target; Bun will be faster. The in-process discovery+render path is <1ms/call.

# node --test rejects top-level await anywhere in the import graph

\`node --test\` fails an entire test file with "Detected unsettled top-level await" if **any** module in the file's import graph uses top-level \`await\` — even a dependency's TLA, and even when the promise resolves fine.

I hit this designing \`src/discover.ts\`: I used top-level \`await loadCore()\` to build the command table at module load (so \`getMergedManifest()\` could stay sync). The probe \`node /tmp/tla/use.ts\` confirmed TLA works under Node 24 native TS stripping — but \`npm test\` (\`node --test\`) rejected it.

**Fix:** replaced TLA with a lazy memoized async init — \`discoverCore()\` returns a cached promise, built on first call; \`getMergedManifest\`/\`findTool\` became \`async\`. Minimal ripple (2 CLI call sites + test loops await).

**Rule of thumb:** in this repo, keep top-level await out of any module reachable from \`test/**\`. Use a memoized \`async function ensureX()\` instead.
