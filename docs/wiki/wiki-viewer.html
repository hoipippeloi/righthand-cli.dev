# Operational-task failure modes of coding agents

Research (web-research skill, three parallel subagents, cited) into why coding agents — Claude Code, Codex, Cursor, Aider, etc. — degrade the moment an *operational* step enters the loop surfaced **five reinforcing failure modes**. This is the evidence base for why [[righthand-cli]] exists: the problem isn't "agents can't do ops," it's "doing ops *inside the coding context* is what breaks them."

## The five failure modes

1. **Hallucinated commands/flags/APIs (P1)** — when the agent runs shell commands itself, it can hallucinate a path or flag and *execute it* with no undo. (Evidence: "terrible hallucinated documentation in Claude Code" — HN; the tool Kintsugi exists solely to intercept agents' shell commands — "a hallucinated path… no undo.")
2. **Context bloat (P2)** — CI YAML, logs, API docs dumped into the coding window cause "context rot." (Anthropic's own guide is built on "the context window fills up fast.")
3. **Token cost (P3)** — that bloat is billed; "tens of thousands of tokens" per session. (Anthropic best-practices guide.)
4. **Flow interruption (P4)** — ops touches "unknown infrastructure," which the agent bounces back to the human. (Anthropic flags this as a literal risk class.)
5. **Session/agent inconsistency (P5)** — yesterday's ops answer is unrecoverable across sessions. (The tool Cass exists solely to re-unify scattered agent histories.)

## The empty quadrant righthand fills

Nothing in today's landscape is *one subprocess CLI that is plugin-extensible, stateless-per-task + on-disk continuity, owns ops tasks end-to-end, host-agnostic, and zero-config-first.* MCP servers are saturated and host-bound; raw CLIs (\`gh\`, \`kubectl\`) are universal but context-expensive. A **subprocess CLI is the only model that reaches every agent** — they all have a shell tool, no registration needed. This validates the [[stateless-subprocess-invocation]] and [[extensible-plugin-system-is-a-first-class-architectural-pill]] decisions.

## Two strategic watch-outs the research surfaced

- **Compress, don't relay** — every command returns a bounded, schema'd summary; full dumps opt-in. See [[compress-don-t-relay]].
- **The plugin contract is the moat** — making it trivial for third parties to add an ops task is the most defensible differentiator and compounds. See [[extensible-plugin-system-is-a-first-class-architectural-pill]].

## Source

- Full cited report: [[righthand-problem-research-report]] (raw findings in \`research_righthand_problem/findings_*.md\`).

# Ops commands declaring capabilities are capability-gated before they run — tests must grant caps

When implementing the C8 ops command groups (\`ci\`, \`logs\`, \`docs\`, \`tasks\`, \`admin\`), each command declares \`capabilities\` (e.g. \`["exec:gh","net:api.github.com"]\`, \`["fs:read"]\`, \`["exec:*","net:*"]\`) as required by the spec. **\`runtime.ts\` dispatch enforces these BEFORE the handler runs** (\`checkCapabilities\` against \`config.permissions\`): a declared cap is permitted only when (a) no \`deny\` pattern matches AND (b) some \`allow\` pattern matches (or \`allow\` holds \`"*"\`).

Consequences that bit during C8:
- \`DEFAULT_CONFIG.permissions.allow = []\`, so **every declared capability is denied → exit 6 (CAPABILITY_DENIED)** — not exit 5. The handler never runs.
- Tests that dispatch these commands must use a config with \`permissions: { allow: ["*"], ... }\`, otherwise they fail with exit 6 (looks like a \`6 !== 0\` assertion failure).
- **Two distinct graceful-degrade axes for ops commands:** (1) *capability denied* → exit 6 (security gate; user hasn't granted the cap); (2) *wrapped binary missing* (ENOENT) → exit 5 (DEP_MISSING) with \`needs_human\` (the command throws \`CommandError(EXIT.DEP_MISSING, msg, needsHuman)\`). On a fresh install with default config, ops commands hit exit 6 before ever probing for \`gh\`/\`kubectl\`. Reaching the exit-5 path requires caps be granted (via \`righthand init\`/config/\`doctor\`).

How a command emits exit 5: \`throw new CommandError(EXIT.DEP_MISSING, "gh not found", "install gh and run gh auth login")\`. The dispatch \`catch\` maps a \`CommandError\` to \`{ exitCode: e.exitCode, needs_human: e.needsHuman }\` — so exit 5 AND a populated \`needs_human\` both come out of one throw. This is the ONLY path to a non-{0,1,2,3} exit, because the normal envelope→exit mapping is \`needs_human?3 : ok?0 : 1\`.

The \`runCli\` test seam lives in \`src/shell.ts\`: \`runCli(bin, args, { runner })\` where \`runner\` defaults to \`spawnSync\`-wrapping \`defaultRunner\`. There's also a module-level \`setRunnerForTest\`/\`resetRunnerForTest\` so commands that call \`runCli(bin, args)\` with no opts (all of them) can be faked end-to-end through \`dispatch\`. A missing binary is signalled by the runner throwing an error with \`code: "ENOENT"\`; \`runCli\` catches it → \`{ ok:false, code:-1, missing:true }\`.
`,

description: \`resolveActiveScope()\` in \`src/footprint.ts\` returns **"project"** only when \`./.righthand/\` (or \`.git/\`) exists in the project root; otherwise it returns **"us

# resolveActiveScope falls back to "user" until a project footprint exists

\`resolveActiveScope()\` in \`src/footprint.ts\` returns **"project"** only when \`./.righthand/\` (or \`.git/\`) exists in the project root; otherwise it returns **"user"**. This is intended (project-scoped ops require an initialized project) but it is a quiet footgun for mutating-command tests.

**Symptom:** a test calls a mutating command's \`run(ctx)\` with \`flags = { yes: true }\` (no \`scope\`), then asserts on the PROJECT footprint — and the mutation silently landed in the USER footprint instead. \`config.json\` appears "missing" (ENOENT) because it was written to \`~/.righthand\` (or the test's USER temp root), not the project temp root.

**Why:** \`scopeFrom()\` helpers in commands like \`src/commands/plugins.ts\` and \`src/commands/reset.ts\` call \`resolveActiveScope(ctx.flags)\` only when \`ctx.flags.scope\` is unset — so before \`init\`, the resolved scope is "user".

**Fix in tests:** pass \`scope\` explicitly. e.g. default the test ctx to \`{ scope: "project", ...flags }\` (as \`test/plugins.test.ts\` does). This also makes scope resolution deterministic regardless of footprint state. (Compare \`src/commands/new.ts\`, which hard-codes \`scope = "user" : "project"\` and so never hits this path.)

**Rule of thumb:** mutating-command tests should never rely on \`resolveActiveScope\`'s implicit default — set the scope explicitly.

type: System Overview
title: Overview

timestamp: "2026-07-24T13:05:00.000Z"
---

# righthand — Overview

**righthand** is a standalone CLI that acts as a universal "right hand" to any AI
coding agent (Claude Code, Cursor, Copilot/Codex, Aider, pi, …). The main coding
LLM spawns righthand as a **subprocess per task**; righthand owns all the
non-coding operational work — CI/CD, logging, docs, tasks, admin, web research —
and returns a **compressed, schema'd JSON result**, keeping the agent's context
window free for writing code. It can also **use an LLM itself** and even **write
new commands into its own surface** (a self-recursive self-builder), safely, with
full rollback.

See \`.prds/righthand-cli/prd.md\` for the full PRD; \`.specs/*/spec.md\` for
implementation specs; \`research_righthand_problem/\` for the evidence base.

## Runtime & toolchain

- **Node + TypeScript, Bun-compatible** (runtime-agnostic JS; no Bun-only APIs).
- **No build step** — Node 22+/24 strips TS types natively; Bun runs \`.ts\` as-is.
  Source must stay strip-only-clean: **no parameter properties, enums, or
  namespaces** (see [[node-strip-only-typescript-rejects-parameter-properties-enum]]).
- **CLI layer:** \`citty\`. **Tests:** \`npm test\` (= \`node --test\`, auto-discovers
  \`test/**/*.test.ts\`). **Only runtime deps:** \`citty\` + \`isomorphic-git\`.
- Cold-start of \`righthand tools\` ≈ **115ms** (under the 200ms C1 bar).

## The shared contracts (in \`src/contracts.ts\`)

- **Envelope** — every command returns \`{ ok, command, summary, result,
  needs_human, meta }\`; JSON when piped, human-readable when a TTY.
- **Exit codes** — 0 ok / 1 fail / 2 usage / 3 NEEDS_HUMAN / 4 auth /
  5 dep-missing / 6 capability-denied.
- **\`ToolDescriptor\`** — MCP-shaped (\`name\`/\`description\`/\`inputSchema\`), with
  \`capabilities\`, \`destructive\`, \`costTier\`, \`mutates\`. Emitted by
  \`righthand tools --json\` so any MCP-aware agent can enumerate righthand.
- **\`Config\`** — layered (project \`./.righthand/config.json\` > user
  \`~/.righthand/config.json\` > env \`RIGHTHAND_*\`); providers, plugins,
  permissions, defaults.

## Architecture (key modules)

- \`src/discover.ts\` — **auto-discovery**: scans \`src/commands/*.ts\` (core) +
  footprint command dirs (\`./.righthand/commands\`, \`~/.righthand/commands\`) +
  plugin manifest fragments. Adding a command = drop a file; **no shared-file
  edits** ([[command-auto-discovery-one-file-per-command-plugin-handlers]]).
- \`src/runtime.ts\` — dispatch: manifest lookup → capability check (exit 6 on
  deny) → approval gate (destructive/expensive need \`--yes\`) → run handler →
  history append.
- \`src/capabilities.ts\` — the sandbox: \`exec:\`/\`net:\`/\`fs:\`/\`llm:\` capability
  strings with \`*\` wildcards; deny-by-default unless granted in
  \`config.permissions.allow\` ([[plugin-sandbox-capability-declaration-permission-flags-subpr]]).
- \`src/versionstore.ts\` + \`src/journal.ts\` — **rollback** (C7): each footprint is
  an \`isomorphic-git\` repo; every mutation is a before/after snapshot with a
  \`change_id\`. \`righthand rollback\` reverts; \`reset\` factory-resets with an undo
  manifest. Never touches app code ([[rollback-version-store-isomorphic-git-pure-js-over-system-gi]]).
- \`src/llm.ts\` — **LLM provider abstraction** (C4): OpenAI-compatible + native
  Anthropic, user-defined \`baseURL\`/\`model\`, \`env:\`/\`keychain:\`/plaintext key
  indirection.
- \`src/shell.ts\` — wraps existing CLIs (\`gh\`, \`kubectl\`, …) and compresses output
  (the core value prop vs raw CLIs).
- \`src/cli.ts\` — \`citty\` wiring; **auto-builds subcommands** from the discovered
  table (collision-free for parallel development).

## Command surface (20 commands, all auto-discovered)

\`version\`, \`tools\`, \`config\` (get/set/list), \`history\`, \`init\`, \`changes\`,
\`rollback\`, \`reset\`, \`new\` (C3 scaffolder), \`plugins\` (install/list/remove),
\`llm ask\`, \`build\` (C5 self-builder), \`research\` (C6), \`doctor\` (C10), and the
ops domains: \`ci\`, \`logs\`, \`docs\`, \`tasks\`, \`admin\` (C8), plus \`hello\` (demo).

## Capabilities map (all 10 built, 166 tests)

C1 Core Runtime · C2 Plugin System · C3 Authoring/Scaffolder · C4 LLM Providers ·
C5 Self-Builder · C6 Research · C7 Rollback/Reset · C8 Ops Domains · C9
Lifecycle/Config · C10 Doctor. Self-builder leads the narrative; rollback is the
trust foundation it depends on.

## How to use

\`\`\`bash
node bin/righthand.ts                 # list commands
node bin/righthand.ts tools --json    # MCP-shaped discovery for agents
node bin/righthand.ts init            # create ./.righthand footprint
node bin/righthand.ts new mycmd       # scaffold a command (auto-discovered)
node bin/righthand.ts build "..."     # LLM writes a new command (needs --yes + caps)
node bin/righthand.ts doctor          # health/config diagnostics
node bin/righthand.ts rollback --yes  # undo the last change
\`\`\`

Capability-gated commands (\`ci\`, \`llm\`, \`build\`, \`research\`, …) are
**deny-by-default**; grant via \`config.permissions.allow\` (e.g. \`["net:llm"]\`)
or \`["*"]\`. \`doctor\` reports what's needed.

## Known follow-ups (deliberately deferred)

Deep-research mode (\`--deep\` is shallow today); real OS keychain for credentials
(\`keychain:\` resolves to null — \`env:\` works now); subprocess isolation for
untrusted plugins (capability+permission enforcement is the v1 baseline);
\`tsc --noEmit\` CI gate; \`righthand restore <undo-id>\` replay; plugin registry
publishing. See \`.prds/righthand-cli/prd.md\` § Phasing & Open Questions.

# Command authoring and scaffolding

## What is it?

**Command authoring & scaffolding (C-AUTHOR)** is the *explicit, documented, first-class* path for a human to create a new task/command for [[righthand-cli]]. Rather than leaving "how do I write a plugin" buried in a README, righthand ships a built-in command (e.g. \`righthand new\` / \`righthand authoring\`) that **states, defines, and shows** how to create a command: the file layout, the manifest-fragment schema, worked examples, **and a scaffolder that generates a starter command**.

It is the **complement** to the *autonomous* authoring path — [[self-recursive-self-building-agent]] (Pillar 5), where the LLM writes commands itself. The two share one contract: C-AUTHOR is the load-bearing, human-legible definition that Pillar 5 later generates against.

## Why does it matter?

- It is **foundational to the plugin system** ([[extensible-plugin-system-is-a-first-class-architectural-pill]], Pillar 3): you cannot have a plugin ecosystem whose authoring story is not first-class. A tool whose "write a plugin" path is a command (not a doc) is dramatically easier to grow an ecosystem around.
- It is the **contract the self-builder (Pillar 5) generates against.** A code generator needs a stable spec to generate against — C-AUTHOR *is* that spec. This is why the self-builder is sequenced *after* C-AUTHOR is proven stable: shipping a code generator before the contract it targets exists builds a generator with no spec.
- It keeps human-authored and LLM-authored commands **indistinguishable** at the contract level — both produce the same manifest-fragment + handler shape.

## Key rules / properties

- **Manifest-fragment schema** each command declares: \`name\` / \`description\` / \`inputSchema\` / \`handler\`.
- **Includes a scaffolder** that generates a working starter command (not just docs) — lowers the activation energy for new authors.
- **Explicit, not buried**: the authoring story is an invokable command, the complement to discovery (\`righthand tools --json\`).
- **Shared contract**: the same fragment schema + handler contract that C-AUTHOR documents is what [[self-recursive-self-building-agent]] (Pillar 5) generates against — one contract, two authors (human + LLM).
- **Verb is \`new\`** (implemented): \`righthand new <name> [--scope project|user] [--desc <text>] [--dry-run] [--force]\`. MVP — foundational (can't ship Pillar 2's plugin story without it).
- **Generated command follows the core auto-discovery pattern** (export \`descriptor\` + \`run\`, optional \`cli\`) — not a separate JSON manifest fragment (that's the C2 plugin model). \`plugin: "@local"\`, \`costTier: "free"\`. Written as **strip-only TS** using *only* \`import type\`, so the file is dynamically importable from any location with no runtime resolution of \`../contracts.ts\` (see [[node-strip-only-typescript-rejects-parameter-properties-enum]]).
- **Mutating + journaled**: the write is wrapped in \`journal()\` (snapshot before/after) and sets \`meta.change_id\`, so a scaffolded command is rollback-able ([[rollback-and-reset-capability-c-reset]]). Honors \`--dry-run\` (returns full content, writes nothing) and \`--force\` (overwrite gate; refuses otherwise).
- **Scope**: project → \`./.righthand/commands/<name>.ts\`; user → \`~/.righthand/commands/<name>.ts\`. Name validated as kebab-case (rejects path traversal by construction).

## Relationships

- [[extensible-plugin-system-is-a-first-class-architectural-pill]] — Pillar 3: C-AUTHOR is the human-facing half of extensibility; plugins can't exist without an authoring story.
- [[self-recursive-self-building-agent]] — Pillar 5: the *autonomous* authoring path; generates against the C-AUTHOR contract. C-AUTHOR must be proven/stable before the self-builder can reliably target it.
- [[righthand-cli]] — the product C-AUTHOR extends; a core lifecycle command of the CLI.

## Source

- PRD scoping turn — user requested an explicit "how to create new tasks/commands" capability; recorded as foundational capability C-AUTHOR.
- \`src/scaffold.ts\` — \`renderCommand()\` template renderer + \`validateName()\` kebab-case/path-traversal guard.
- \`src/commands/new.ts\` — the \`new\` command: validates, renders, writes into the footprint commands dir inside a journaled mutation.
- \`test/scaffold.test.ts\` — strip-only smoke (dynamic import), dry-run no-write, journaled write, user scope, overwrite refusal/\`--force\`, invalid-name.

# Command output envelope and exit codes

## What is it?

The **bounded output contract** every righthand command returns: a single standard **JSON envelope** on stdout (when piped) plus a small, fixed **exit-code** set. Defined in \`.specs/core-runtime/spec.md\` (C1) as the shared contract every other capability (C2/C3/C7/C9/ops domains) references. It is how a coding agent reliably consumes righthand's result without parsing free-form text, and how automation branches on success/failure.

Envelope shape:

\`\`\`jsonc
{ "ok": true, "command": "ci.status", "summary": "main: 2 failed, 1 running",
  "result": { /* structured, command-specific */ },
  "needs_human": null,
  "meta": { "version", "duration_ms", "change_id": null, "tokens_used": 0 } }
\`\`\`

Exit codes: \`0\` success · \`1\` generic failure · \`2\` usage/arg error · \`3\` \`NEEDS_HUMAN\` (agent must escalate) · \`4\` auth/credential · \`5\` dependency missing · \`6\` capability denied.

## Why does it matter?

- It is the **I/O contract between righthand and the agent that calls it** — previously an open question on [[righthand-cli]] ("exact command surface & I/O contract"), now locked by C1.
- The \`summary\` field is the **single highest-leverage output**: it is what an agent reads *instead of* ingesting raw logs. This is the whole point of righthand — keep the main agent's context free of ops noise (see the [[compress-don-t-relay]] rule).
- Non-zero exits **still emit the envelope** (with \`ok:false\`), so an agent gets structured failure context, not just a process exit.
- Exit code 3 (\`NEEDS_HUMAN\`) + a non-null \`needs_human\` reason are the paired mechanism by which righthand signals "I can't finish this autonomously — escalate."

## Key rules / properties

- **Output mode:** JSON envelope by default when stdout is **piped**; human-readable when a **TTY**. \`--json\` / \`--quiet\` / \`--full\` / \`--raw\` flags override. \`--raw\` replaces the envelope with untransformed underlying-tool output (escape hatch).
- **\`summary\` ≤ ~120 chars**, decision-ready in one line; full detail lives in \`result\`.
- **\`meta.change_id\`** is set only when the command mutated state — it carries the ULID that links into [[rollback-and-reset-capability-c-reset]]'s version store and the C9 history log. Null for read-only commands.
- **Exit codes map 1:1 to envelope state** (e.g. \`needs_human != null\` ⇒ exit 3; capability refused ⇒ exit 6). Codes propagate everywhere, so they were the C1 review focus.

## Relationships

- [[righthand-cli]] — this is the I/O contract the product exposes to calling agents; resolves the entity's open "I/O contract" question.
- [[rollback-and-reset-capability-c-reset]] — \`meta.change_id\` (ULID) is the cross-link into the version store / history.
- [[stateless-subprocess-invocation]] — the envelope is the stateless hand-back: no session, no daemon, just stdin → stdout per task.
- [[compress-don-t-relay]] — \`summary\` is the compression surface that rule operates on.

## Source

- \`.specs/core-runtime/spec.md\` (C1) — "Bounded output contract" + "Exit codes" + "Discovery: \`righthand tools --json\`" sections. Authoritative.

# Factory reset capability (C-RESET)

## What is it?

**Factory reset (C-RESET)** is a first-class capability that returns righthand to a clean / known state, **undoing what righthand itself has built or configured.** It is the safety valve behind righthand's core design philosophy:

> righthand can do anything, but you can always undo it.

It is especially load-bearing now that the **self-builder ([[self-recursive-self-building-agent]], Pillar 5) writes code into righthand** — a reset is how you walk back generated / installed plugins to a clean baseline.

## Why does it matter?

- **It is the trust foundation for every powerful capability.** The self-builder writes code, plugins get installed, config mutates. Without a reliable undo, "righthand can do anything" becomes a liability. C-RESET is what makes that power safe to grant.
- **It de-risks the self-recursive self-builder** — generated/installed plugins can always be rolled back to a clean baseline.
- For a **distributable tool adopted by third parties**, a credible "return to known-good" path is table stakes for trust (see [[righthand-cli]]).

## Key rules / properties

- **Design philosophy (locked):** *righthand can do anything, but you can always undo it.* C-RESET instantiates this.
- **Proposed design (pending user confirmation):** graduated reset — e.g. \`righthand reset plugins\` / \`config\` / \`history\` / \`all\`, **defaulting to \`--dry-run\`** (show what *would* be wiped before doing it).
- **Preserves the user's actual application codebase.** It resets **righthand's own footprint**: config, LLM keys, all generated/installed plugins (project-local \`.righthand/\` + user-global \`~/.righthand/\`), manifest cache, history logs — *not* the user's project files.
- **Proposed safety (pending confirmation):** every reset writes an **undo manifest first** (a tarball of what is being deleted), so even a reset is recoverable.
- **Open:** the exact destructive scope is pending user confirmation. The assistant's recommendation is **footprint-reset + dry-run + undo-manifest**; touching the user's application codebase is assumed **not** intended.

## Relationships

- [[self-recursive-self-building-agent]] — the capability that makes reset most *necessary*: generated/installed plugins must be roll-backable to a clean baseline.
- [[righthand-cli]] — C-RESET is a lifecycle command of the product (e.g. \`righthand reset ...\`).
- [command-authoring-and-scaffolding](./command-authoring-and-scaffolding.md) — a sibling first-class capability (C-AUTHOR); both are load-bearing CLI capabilities with documented contracts.

## Source

- PRD scoping turn (this session) — the user requested a reset-to-factory-defaults capability ("all is allowed, but a user should be able to reset to factory defaults"). Recorded as capability **C-RESET** with the "undoable by design" philosophy. Exact mechanism pending user confirmation. No code committed yet.

# Ops domain commands (C8)

## What is it?

The five **C8 ops command groups** — \`ci\`, \`logs\`, \`docs\`, \`tasks\`, \`admin\` — are the actual operational surface a coding agent shells out to. Each wraps an existing CLI (\`gh\`, \`kubectl\`, \`aws\`, \`markdownlint\`…) and **compresses** its output into the standard bounded \`Envelope\` (the core righthand value prop: the agent gets a decision-ready summary, never a raw log dump). They are auto-discovered core commands — one file each under \`src/commands/\`.

## Why does it matter?

This is righthand's end-user value: "compress, don't relay." Every group returns \`{ ok, command, summary, result, needs_human, meta }\` and degrades gracefully — a missing wrapped binary yields exit 5 (\`DEP_MISSING\`) with a \`needs_human\` install hint, never a crash.

## Key rules / properties

- One file per group at \`src/commands/<name>.ts\`, exporting \`descriptor\` + \`run\` + \`cli\`. Picked up by [righthand-core-architecture](./righthand-core-architecture.md) auto-discovery — **no shared-file edits** to add one.
- Each declares \`capabilities\` + \`costTier: "free"\`. Declared caps are enforced by dispatch (see [ops-commands-declaring-capabilities-are-capability-gated-bef](./ops-commands-declaring-capabilities-are-capability-gated-bef.md)): denied/ungranted → exit 6 before the handler runs.
- Missing wrapped binary → \`throw new CommandError(EXIT.DEP_MISSING, …, needsHuman)\` → exit 5 + \`needs_human\`.
- All subprocess work goes through \`src/shell.ts\` \`runCli\`, which has a runner test seam (\`opts.runner\` / module-level \`setRunnerForTest\`).

## The five groups

- \`ci status [--branch]\` / \`ci logs [--run]\` — wraps \`gh run list\` / \`gh run view --log\`. Compresses to \`"main: 2 failed, 1 running"\` + \`{runs:[…]}\`; logs to tail + error lines. caps \`["exec:gh","net:api.github.com"]\`.
- \`logs tail [--source]\` — picks first present of \`kubectl logs\` / \`aws logs tail\`; none → exit 5. caps \`["exec:*","net:*"]\`.
- \`docs lint [--path]\` — runs \`markdownlint-cli2\`/\`markdownlint\` if present, else a naive \`.md\` TODO/FIXME scan. caps \`["fs:read"]\`.
- \`tasks list\` — wraps \`gh issue list --json\`; compresses to \`{open, items}\`. caps \`["exec:gh","net:api.github.com"]\`.
- \`admin env [--name]\` — reads \`process.env\` + project \`.env\`; **values fully redacted** (\`maskValue\`), only keys + set-ness + a masked value emitted (bar #4). caps \`["fs:read"]\`.

## Relationships

- [righthand-cli](./righthand-cli.md) — the product these belong to.
- [ops-commands-declaring-capabilities-are-capability-gated-bef](./ops-commands-declaring-capabilities-are-capability-gated-bef.md) — why tests grant \`allow:["*"]\` and how exit 5 vs exit 6 split.
- [command-output-envelope-and-exit-codes](./command-output-envelope-and-exit-codes.md) — the envelope + exit-code contract every group returns.

## Source

- \`src/shell.ts\` — shared \`runCli\` subprocess helper + test seam + \`hasBinary\` presence check.
- \`src/commands/{ci,logs,docs,tasks,admin}.ts\` — the five groups.
- \`test/shell.test.ts\`, \`test/ops.test.ts\` — coverage with injected fake runners (no real \`gh\`/\`kubectl\` needed).

# doctor command

**\`righthand doctor\`** is the read-only health & integration diagnostics command (capability [c10-diagnostics](./c10-diagnostics.md) / \`decisions/diagnostics-command-righthand-doctor-c10\`). It probes every integration righthand depends on and returns a bounded **green / yellow / red** report so a user or the main LLM can see what is misconfigured *before* invoking real commands — directly serving the PRD's "zero-config default; degrade gracefully when optional integrations are absent" bar.

## What it is

A pure, side-effect-free diagnostic. It reads config + the footprint, checks binary presence, and never mutates state, declares no \`capabilities\`, and is \`costTier: "free"\`. Output honors the standard [command-output-envelope-and-exit-codes](./command-output-envelope-and-exit-codes.md): \`result = { overall, checks }\`, where each check is \`{ name, status: "green"|"yellow"|"red", detail }\`.

## Details

- **Location**: \`src/doctor.ts\` (logic) + \`src/commands/doctor.ts\` (envelope wrapper, auto-discovered).
- **CLI**: \`righthand doctor [--json]\` — no special args; \`--json\` is the global flag. \`export const cli = {}\`.
- **Checks emitted**:
  - \`runtime\` — version + node/bun (always green).
  - \`footprint\` — green if \`./.righthand\` exists, else yellow ("run \`righthand init\`").
  - \`version-store\` — green if the footprint \`.git\` (isomorphic-git, [rollback-version-store-isomorphic-git-pure-js-over-system-gi](./rollback-version-store-isomorphic-git-pure-js-over-system-gi.md)) is init'd, else yellow.
  - \`providers\` / \`provider:<name>\` — uses [llm-provider-integration](./llm-provider-integration.md)'s \`resolveApiKey()\` per \`config.providers\`; **red** when zero providers configured ("no LLM provider — build/research/llm unavailable"), else green/yellow per key resolvability.
  - \`default-provider\` — yellow if \`config.defaults.provider\` unset but providers exist; validates via \`resolveProvider()\`.
  - \`plugins\` — uses [plugins-command](./plugins-command.md) / \`plugininstall.ts\` \`listPlugins\`; green if none or all have manifests, yellow per missing \`manifest.json\`.
  - \`cli:gh|kubectl|terraform|aws\` — uses \`shell.ts\` \`hasBinary\`; **yellow when absent, never red** (optional ops integrations).
  - \`capabilities\` — informational count of capability-declaring commands vs \`permissions.allow\` grants; yellow if such commands exist but allow is empty.
- **Overall rollup**: \`red\` if any red, else \`yellow\` if any yellow, else \`green\`.
- **TEST SEAMS** (so tests never touch the real filesystem): injectable \`hasBinary\`, injectable \`listPlugins\`, and a passed-in \`config\` (defaults to \`loadConfig()\` in prod). Covered by \`test/doctor.test.ts\` (19 tests).

## Relationships

- [command-output-envelope-and-exit-codes](./command-output-envelope-and-exit-codes.md) — the envelope \`doctor\` emits into.
- [llm-provider-integration](./llm-provider-integration.md) — \`resolveProvider\` / \`resolveApiKey\` power the provider checks.
- [plugins-command](./plugins-command.md) — \`listPlugins\` powers the plugin check.
- [factory-reset-capability-c-reset](./factory-reset-capability-c-reset.md) — doctor surfaces an uninitialized rollback store so the user runs \`init\` before relying on rollback.
- \`decisions/diagnostics-command-righthand-doctor-c10\` — the decision/ADR for this command.

## Lifecycle

- First added: Phase 3 (Core Ops Value) — C10, per \`.prds/righthand-cli/prd.md\` phasing.
- Depends on: C1 (runtime/dispatch), C2 (plugins), C4 (LLM providers) — all read-only.

# llm command

**\`righthand llm\`** is the user-facing command that wraps [llm-provider-integration](./llm-provider-integration.md)'s \`complete()\`. It is the thinnest possible surface over the LLM: send a prompt, get back a bounded envelope. Auto-discovered from \`src/commands/llm.ts\` (one file per command — see [command-auto-discovery-one-file-per-command-plugin-handlers-](./command-auto-discovery-one-file-per-command-plugin-handlers.md)).

## Why does it matter?

It is the simplest demonstration of the C4 capability and the canonical pattern future LLM-augmented commands ([llm-augmented-commands-as-a-first-class-pillar](./llm-augmented-commands-as-a-first-class-pillar.md)) will follow: declare \`capabilities: ["net:llm"]\`, call \`complete()\`, return an envelope with \`meta.tokens_used\`.

## Details

- **Location**: \`src/commands/llm.ts\`
- **Invocation**: \`righthand llm ask "<prompt>" [--provider <name>]\`. The literal \`ask\` binds to the positional; the real prompt lands in citty's leftover-positional \`args._\` and is recovered by \`extractPrompt()\`. (Dispatch-level tests pass \`prompt\` directly as \`args.prompt\`.)
- **Descriptor**: \`name: "llm"\`, \`capabilities: ["net:llm"]\`, \`costTier: "cheap"\`, \`plugin: "@righthand/core"\`. **Not** destructive and cheap → bypasses the dispatch approval gate.
- **Result envelope**: \`result = { text, model, tokensUsed }\`, \`meta.tokens_used = tokensUsed\`, summary \`"llm replied (N tokens, <model>)"\`.
- **Capability gate**: because it declares \`net:llm\`, dispatch denies it (exit 6, \`CAPABILITY_DENIED\`) unless \`config.permissions.allow\` grants \`net:llm\` / \`net:*\` / \`*\`. With the capability granted but no provider/key configured, \`run()\` throws \`CommandError(EXIT.AUTH)\` with a \`needs_human\` hint → exit 4. See [net-llm-capability-gate-for-llm-commands](./net-llm-capability-gate-for-llm-commands.md).
- **\`cli\` export**: \`{ args: { prompt: positional, provider: string flag } }\` — consumed by \`src/cli.ts\` auto-wiring (no shared-file edits).

## Relationships

- [llm-provider-integration](./llm-provider-integration.md) — the \`complete()\` API this command calls.

- **First added**: C4 (Phase 2). One of the auto-discovered core commands; appears in \`righthand tools --json\`.

# LLM provider integration

**LLM provider integration** (\`src/llm.ts\`) is the single load-bearing module every reasoning capability builds on. It exposes one entry point — \`complete()\` — that turns an \`LlmRequest\` into an \`LlmResponse\` against a user-configured provider, plus the helpers that resolve *which* provider and *which* API key to use. Web research ([web-research-search-as-a-capability-d6](./web-research-search-as-a-capability-d6.md)), the self-builder ([self-recursive-self-building-agent](./self-recursive-self-building-agent.md)), and the LLM-assisted ops domains all call \`complete()\`; none of them know whether the backend is OpenAI-compatible or Anthropic.

It implements capability **C4** of [righthand-cli](./righthand-cli.md) and the accepted decision [llm-provider-model-openai-compatible-base-plus-native-anthro](./llm-provider-model-openai-compatible-base-plus-native-anthro.md) (OpenAI-compatible base + native Anthropic).

## Why does it matter?

This is the seam that separates "a wrapper that compresses" from "a wrapper that reasons." Every LLM-augmented command ([llm-augmented-commands-as-a-first-class-pillar](./llm-augmented-commands-as-a-first-class-pillar.md)) routes through here, so the contract must be stable and provider-agnostic — other capabilities depend on exactly this interface.

## Details

- **Location**: \`src/llm.ts\`
- **Interface / Schema** (the contract other capabilities depend on — do not break):
  - \`LlmMessage { role: "system"|"user"|"assistant"; content: string }\`
  - \`LlmRequest { provider: string; messages: LlmMessage[]; model?; temperature?; maxTokens? }\`
  - \`LlmResponse { text; model; tokensUsed; finishReason? }\`
  - \`resolveProvider(config, name?)\` → \`{ name, provider }\`. Resolution order: explicit name → \`config.defaults.provider\` → first listed provider → throw \`AUTH\`. Empty-string name is treated as unset (falls to default).
  - \`resolveApiKey(provider)\` → \`string | null\`. \`"env:VAR"\`→\`process.env[VAR]\`; plaintext→as-is; \`"keychain:ref"\`→\`null\` (deferred, \`// TODO keychain\`, no native dep in v1). See [credential-values-use-env-keychain-indirection-never-plainte](./credential-values-use-env-keychain-indirection-never-plainte.md).
  - \`complete(req, opts?: { config?; fetchFn?; signal? })\` → \`Promise<LlmResponse>\`. \`opts.fetchFn\` is a **TEST SEAM** — tests inject a fake fetch; no real network in the suite.
- **Provider types & request shapes**:
  - \`openai-compatible\`: \`POST {baseURL||"https://api.openai.com/v1"}/chat/completions\`, header \`Authorization: Bearer <key>\`, body \`{model, messages, temperature, max_tokens}\`.
  - \`anthropic\`: \`POST {baseURL||"https://api.anthropic.com"}/v1/messages\`, headers \`x-api-key\` + \`anthropic-version: 2023-06-01\`, body \`{model, messages, max_tokens, system?}\`. \`system\` messages are **extracted** to the top-level \`system\` param (Anthropic rejects \`role:"system"\` inside \`messages\`). \`max_tokens\` is required by Anthropic → floored to \`1024\` when unset.
- **Token accounting**: \`tokensUsed\` = \`usage.total_tokens\` when present, else \`usage.input_tokens + usage.output_tokens\`, else \`0\`. Flow upward as \`meta.tokens_used\` on the envelope (see [llm-command](./llm-command.md)).
- **Error model**: no provider configured, unknown provider name, or unresolvable key → \`CommandError(EXIT.AUTH)\` (exit 4). HTTP failure → \`CommandError(EXIT.FAIL)\`.
- **Configuration**: providers live in [config](./config.md) under \`config.providers.<name>\` (\`type\`, \`baseURL\`, \`apiKey\`, \`model\`, \`params\`); default provider = \`config.defaults.provider\`.

## Relationships

- [llm-provider-model-openai-compatible-base-plus-native-anthro](./llm-provider-model-openai-compatible-base-plus-native-anthro.md) — the decision this implements.
- [llm-augmented-commands-as-a-first-class-pillar](./llm-augmented-commands-as-a-first-class-pillar.md) — why righthand reasons mid-task.
- [llm-command](./llm-command.md) — the user-facing \`righthand llm ask\` command that wraps \`complete()\`.
- [credential-values-use-env-keychain-indirection-never-plainte](./credential-values-use-env-keychain-indirection-never-plainte.md) — the \`env:\`/\`keychain:\` indirection \`resolveApiKey\` honors.

## Lifecycle

- **First added**: C4 (Phase 2 — Reasoning). Implemented alongside [llm-command](./llm-command.md). Unblocks C5 (self-builder), C6 (research), and the LLM-assisted ops domains.
- **Deferred**: OS keychain resolution (\`keychain:\` refs return \`null\` until a native keychain dep is added — no native dependency in v1 core).

# plugins command

## What it is

The **\`plugins\` command** implements C2's install/list/remove lifecycle for [righthand-cli](./righthand-cli.md) plugins. A plugin is an npm package installed into the footprint plugins dir that ships a \`manifest.json\` fragment (the discovery contract: \`{plugin, handler, tools}\`) so [extensible-plugin-system-is-a-first-class-architectural-pill](./extensible-plugin-system-is-a-first-class-architectural-pill.md) can discover it without importing code.

\`\`\`
righthand plugins install <pkg>[@version] [--scope project|user]
righthand plugins list   [--scope project|user]
righthand plugins remove <pkg>   [--scope project|user]
\`\`\`

## Why it matters

It is the user-facing half of the plugin pillar — without install/list/remove, the discovery + authoring contracts have nothing to install. It is also the first command that drives an **external package manager** (\`npm\`), so it establishes the test-seam pattern for subprocess npm calls (mirroring \`src/shell.ts\`'s \`Runner\` seam for ops CLIs).

## Details

- **Location**: \`src/commands/plugins.ts\` (command) + \`src/plugininstall.ts\` (npm shell-out + disk reads).
- **Interface**: two citty positionals — \`action\` (\`install|list|remove\`, defaults to \`list\`) and \`pkg\` (spec for install, name for remove); \`cli.scope: true\` adds the shared \`--scope\` flag.
- **Install mechanism**: \`npm install --prefix <pluginsDir> <pkg>\` via \`child_process.spawnSync\`. npm drops the package at \`<pluginsDir>/node_modules/<name>/\`. The package's \`package.json\` gives the version; its \`manifest.json\` (present + valid JSON) sets \`hasManifest\`.
- **config.plugins**: install upserts \`{name, version}\` into the scoped \`config.json\` \`plugins\` array (de-duped by name). A missing manifest still registers the name but surfaces a \`warning\` (the plugin is not discoverable by \`righthand tools\` until a fragment ships).
- **list**: merges \`config.plugins\` with a disk scan of \`<pluginsDir>/node_modules\` (handles \`@scope/pkg\` layout). Disk truth wins for \`version\`/\`hasManifest\`; config adds registered-but-absent entries.
- **remove**: \`npm uninstall --prefix\` (best-effort) + drop the entry from \`config.plugins\`.
- **Mutation contract**: install/remove are \`mutates: true\` — each owns its \`journal()\` (before/after snapshot over the whole footprint, which tracks \`plugins/node_modules/...\`), honors \`--dry-run\`, and confirms via \`src/confirm.ts\` (\`--yes\` / interactive / non-TTY refusal). The npm install + config write land in ONE journaled change so rollback restores both. npm failure throws inside the mutate → the change is abandoned as an incomplete before/after pair and mapped to a fail envelope.

## Test seam

Every npm call goes through \`activeNpmRunner()\` in \`src/plugininstall.ts\`: \`defaultNpmRunner\` (real \`npm\` via \`spawnSync\`) unless \`setNpmRunnerForTest(fake)\` is set. Tests inject a fake that materializes a package dir + \`manifest.json\` under \`node_modules/\` — **no network**. Mirrors \`setRunnerForTest\` in [shell](./shell.md) exactly. See [resolveactivescope-falls-back-to-user-until-a-project-footprint-exists](./resolveactivescope-falls-back-to-user-until-a-project-footpr.md) for a test gotcha.

## Relationships

- [extensible-plugin-system-is-a-first-class-architectural-pill](./extensible-plugin-system-is-a-first-class-architectural-pill.md) — the pillar this instantiates.
- [command-authoring-and-scaffolding](./command-authoring-and-scaffolding.md) — the *authoring* half; \`plugins install\` is the *consumption* half.
- [mutating-commands-own-their-journaling-not-a-dispatch-auto-w](./mutating-commands-own-their-journaling-not-a-dispatch-auto-w.md) — install/remove follow this rule.
- [rollback-and-reset-capability-c-reset](./rollback-and-reset-capability-c-reset.md) — installs/removes are rollback-able.
- [distribution-npm-based-for-cli-and-plugins-version-pinned-op](./distribution-npm-based-for-cli-and-plugins-version-pinned-op.md) — npm-prefix install is the chosen distribution mechanism.

## Source

- \`src/commands/plugins.ts\` — \`descriptor\` + \`installFlow\`/\`removeFlow\`/\`run\`.
- \`src/plugininstall.ts\` — \`defaultNpmRunner\`/\`setNpmRunnerForTest\`/\`activeNpmRunner\`, \`installPlugin\`/\`uninstallPlugin\`/\`listPlugins\`, \`packageNameFromSpec\`, \`readManifest\`.
- \`test/plugins.test.ts\` — empty list, install (manifest + no-manifest + dry-run + no-\`--yes\` + npm-failure), remove (+ dry-run), \`packageNameFromSpec\` unit; all via an injected fake npm runner over an isolated temp footprint.

# righthand cli

**righthand cli** is the product this repository builds: an always-available CLI that a **main / coding LLM** can hand tasks off to. The coding agent focuses on building the app; righthand picks up "the rest" — the non-coding work that nonetheless has to get done.

It is a **standalone product** living in **its own repository**, intended to be **distributed to others** who want to use it (a public, installable tool — not an internal-only or plugin-of-another-system thing). Because it ships to outside users, first-run experience, config discovery, and "works in anyone's repo" are first-class design concerns.

The project is **greenfield** (only wiki scaffolding exists today). Its shape is being defined via a PRD interview (see the project \`overview\`).

## Why does it matter?

Coding LLMs (pi, Claude Code, Codex, Cursor, Aider, etc.) currently context-switch into admin chores — CI/CD, logging, docs, task tracking — that dilute their attention and burn context. righthand is the dedicated "right hand" that absorbs those chores so the main agent stays on the build. It is the central product the whole repo exists to produce; every other file here serves it.

Being a **standalone, distributable product** means onboarding friction and config portability directly affect adoption — a tool nobody can get running in their own repo gets used by nobody.

## Details

- **Location**: \`E:/righthand.cli\` (repo root). No source tree yet.
- **Interface / Schema**: the main LLM invokes righthand **as a subprocess via the terminal** (\`righthand <command> ...\`). The exact command surface (verbs, args, I/O contract) is still open. Core idea is *command dispatch*: the main LLM sends commands and task descriptions, and righthand owns the task to completion.
- **Invocation / lifecycle**: **spawned per task, torn down when the task finishes — stateless per invocation**, not a daemon. Any cross-task state (history, progress, config, results) must persist to disk/DB and be reloaded each run, not held in memory. See [[stateless-subprocess-invocation]].
- **Runtime / tech stack**: **Node + TypeScript** — decided. Chosen for fast startup; cold-start must stay lean via **lazy plugin loading** (each task's code loaded only when invoked). See [[node-typescript-is-the-runtime-for-righthand]].
- **Extensibility model — Pillar 3**: **modular plugin system is a first-class architectural pillar** — third parties can author/register their own tasks/commands; discovery + dispatch treat them like built-ins. See [[extensible-plugin-system-is-a-first-class-architectural-pill]].
- **LLM augmentation — Pillar 4 (accepted)**: righthand has its **own** LLM config and can invoke an LLM mid-task. Commands split into "do the ops" and "do the ops *and reason about it*"; degrades to pure-ops when no LLM is configured. See [[llm-augmented-commands-as-a-first-class-pillar]].
- **Self-recursive / self-building agent — Pillar 5 (proposed)**: with an LLM configured, a user can tell righthand's LLM what features it wants and the LLM builds them into righthand itself (righthand as its own developer). The **approval stance is locked to show-and-confirm-before-install** and **code location to both project-local + user-global (picked at generation time)** (Q5c resolved); the generation model (persistent vs ad-hoc vs hybrid) remains open. See [[self-recursive-self-building-agent]].
- **Target audience**: **general-purpose — all four personas matter** (indie, pro dev, DevOps/SRE, general); **pro-dev-with-real-ops is the sharpest design target**. See [[general-purpose-persona-targeting]].
- **Scope of handed-off tasks** (stated intent): admin, CI/CD, logging, documentation, task tracking — "all tasks that don't involve the actual building of an app."
- **Distribution model**: standalone, distributable product (own repo, installable by third parties). The packaging/install *mechanism* (npm, Homebrew, Scoop/winget, GitHub Releases, etc.) is still open — though npm is a natural fit given the Node runtime.
- **Configuration**: TBD (config file location/format, global-vs-per-repo config, env vars, or a mix). Must include the **dedicated LLM provider config** from Pillar 4. Distribution to others makes zero-config default behavior + easy discovery high priority.

## Relationships

- \`overview\` (project overview) — righthand cli is the product the project overview describes.
- [[stateless-subprocess-invocation]] — the invocation model this entity runs under (stateless subprocess per task).
- [[node-typescript-is-the-runtime-for-righthand]] — why the runtime is Node + TypeScript.
- [[extensible-plugin-system-is-a-first-class-architectural-pill]] — why extensibility is a first-class pillar (Pillar 3).
- [[llm-augmented-commands-as-a-first-class-pillar]] — why LLM augmentation is a first-class pillar (Pillar 4).
- [[self-recursive-self-building-agent]] — the self-building capability (Pillar 5, proposed).
- [[general-purpose-persona-targeting]] — audience and design target.

## Lifecycle

- **First added**: greenfield; PRD interview opened in an earlier turn. Vision/intent captured here; nothing is built yet.
- **Recent changes**: (1) invocation model (subprocess via terminal, stateless per task) defined; (2) distribution model confirmed as standalone, third-party-distributable; (3) **runtime resolved to Node + TypeScript**; (4) **extensible plugin system raised to a first-class architectural pillar (Pillar 3)**; (5) **LLM-augmented commands added as Pillar 4 (accepted)**; (6) **self-recursive self-building agent added as Pillar 5 (proposed — mechanism pending Q5b)**; (7) **persona targeting locked as general-purpose, pro-dev-with-ops as design target**; (8) **self-builder approval stance (show-and-confirm-before-install) + code location (both, at generation time) resolved (Q5c)**.
- **Open questions** (to resolve before spec): (1) primary target LLM(s); (2) exact command surface & I/O contract; (3) packaging/install mechanism (npm/brew/releases/etc.); (4) plugin discovery, registration, and task-author contract; (5) the self-builder's generation model (persistent vs ad-hoc vs hybrid) — approval stance (show-and-confirm-before-install) and code location (both, at generation time) were resolved in Q5c.

## Source

- PRD interview (this session) — stated intent, opening scoping questions, the subprocess invocation model, the standalone-distributable product confirmation, the Node+TS runtime choice, the first-class plugin-system pillar, the LLM-augmentation pillar, the proposed self-recursive agent, and the persona-targeting lock. No code committed yet.

# Compress, don't relay

## Guideline

Every righthand command must return a **bounded, schema'd summary**, not a raw dump of the underlying tool's output. Full/verbose output is **opt-in** (an explicit flag), never the default.

## When it applies

To every command's output contract — the stdout righthand returns to the main coding LLM for any handed-off task (CI, logs, docs, task tracking, etc.).

## Rationale

Research into coding-agent failure modes ([[operational-task-failure-modes-of-coding-agents]]) found the agent's pain is **context, not capability**: dumping CI logs, YAML, or API docs into the coding window causes context rot and token cost (P2, P3). righthand exists to *absorb* ops work out of the coding context — so its own output must stay tight, or it just relocates the bloat rather than removing it. A bounded, schema'd summary is the unit the coding LLM can act on without re-bloating its window.
`,

# Credential values use env:/keychain: indirection — never plaintext on disk or in output

## Guideline

Any configuration value that is a **secret** (LLM provider \`apiKey\`, tokens, passwords) must be stored as a **reference**, not the secret itself:

- \`env:VAR\` — resolve from the environment variable \`VAR\`
- \`keychain:<ref>\` — resolve from the OS keychain / secret store

Resolved values are:

- **Never written to disk in plaintext** (config stores only the reference string).
- **Never emitted to output** of any kind — not stdout, logs, error messages, or the JSON envelope.

## When it applies

Every place a secret enters the system: config files (\`~/.righthand/config.json\`, \`./.righthand/config.json\`), command output (\`config get\` / \`config list\`), and project bootstrap (\`init --from\`). Specifically:

- \`config get\` / \`config list\` **must redact** — show \`env:OPENAI_API_KEY\`, never the resolved value.
- \`init --from\` **refuses to copy credentials** between footprints (secrets are per-machine via the keychain).
- Credential *resolution* happens in the C4 credential layer; config only ever holds the reference.

## Rationale

righthand is a **distributable tool adopted by third parties**, and its output is **consumed by coding agents** (piped JSON). Plaintext secrets in config files would be accidentally committed to git, leaked across machines, or dumped into agent stdout/logs — the standard secret-leak failure modes. Indirection + redaction is a **never-break security bar** ("bar #4" in the PRD). It is cheap to enforce once at the read/render boundary (root-cause fix) and catastrophic to skip.

## Evidence / source

- \`.specs/lifecycle-config/spec.md\` (C9) — "Credential resolution" section + the \`config get/list\` redaction requirement + \`init --from\` refusal.
- \`.specs/core-runtime/spec.md\` (C1) — "the runtime itself holds no secrets inline; credentials come from C4's keychain/env layer."
- PRD never-break bar #4.
`,
