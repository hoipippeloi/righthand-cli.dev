<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>righthand web</title>
<!-- righthand-web-app -->
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --border:#2a3138;
    --txt:#e6edf3; --mut:#8b949e; --accent:#f78166;
    --green:#3fb950; --red:#f85149; --yellow:#d29922;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt); display:grid; grid-template-rows:auto 1fr; height:100vh; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:10px; }
  header b { color:var(--accent); font-size:16px; }
  header .sub { color:var(--mut); font-size:12px; }
  main { display:grid; grid-template-columns:300px 1fr; min-height:0; }
  aside { border-right:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside input { margin:10px; padding:8px; background:var(--panel2); border:1px solid var(--border);
    color:var(--txt); border-radius:6px; }
  aside .list { overflow:auto; padding:0 6px 12px; }
  .grp h4 { margin:10px 6px 4px; color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .cmd { display:block; width:100%; text-align:left; padding:7px 8px; background:none; border:0;
    color:var(--txt); cursor:pointer; border-radius:6px; font-size:13px; }
  .cmd:hover, .cmd.active { background:var(--panel2); }
  .cmd small { color:var(--mut); display:block; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  section { padding:16px 20px; overflow:auto; }
  h2 { margin:0 0 4px; }
  .desc { color:var(--mut); margin:0 0 16px; }
  .formrow { margin-bottom:12px; }
  .formrow label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; }
  .formrow label .req { color:var(--red); }
  .formrow input, .formrow select { width:100%; max-width:420px; padding:8px; background:var(--panel2);
    border:1px solid var(--border); color:var(--txt); border-radius:6px; font-size:13px; }
  .flags { display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 16px; color:var(--mut); font-size:12px; }
  .flags label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  button.run { background:var(--accent); color:#1a1a1a; border:0; padding:9px 18px; border-radius:6px; font-weight:600; cursor:pointer; }
  button.run:disabled { opacity:.5; cursor:default; }
  .result { margin-top:18px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .badge.ok { background:rgba(63,185,80,.15); color:var(--green); }
  .badge.bad { background:rgba(248,81,73,.15); color:var(--red); }
  .badge.warn { background:rgba(210,153,34,.15); color:var(--yellow); }
  .summary { margin:6px 0; font-size:15px; }
  pre { background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:10px; overflow:auto;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .meta { color:var(--mut); font-size:12px; margin-top:6px; }
  .empty { color:var(--mut); }
</style>
</head>
<body>
<header>
  <b>righthand</b><span class="sub">web · visual command runner</span>
</header>
<main>
  <aside>
    <input id="search" placeholder="search commands…" autocomplete="off" />
    <div class="list" id="list"></div>
  </aside>
  <section id="pane"><p class="empty">Select a command on the left, or search.</p></section>
</main>
<script>
const DOMAINS = [
  ["ci","CI/CD"],["logs","Observability"],["docs","Docs"],["tasks","Tasks"],["admin","Admin"],
  ["llm","LLM"],["build","Self-builder"],["research","Research"],["new","Extend"],["plugins","Extend"],
  ["config","System"],["history","System"],["init","System"],["changes","System"],["rollback","System"],
  ["reset","System"],["doctor","System"],["version","System"],["tools","System"],["hello","Demo"]
];
const $ = (s) => document.querySelector(s);
let tools = [], selected = null;

function domainOf(name){
  const m = DOMAINS.find(([n]) => n === name || name.startsWith(n));
  return m ? m[1] : "System";
}
function escapeHtml(s){ return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

async function init(){
  const r = await fetch("/api/tools");
  const { tools: t } = await r.json();
  tools = (t || []).filter(x => x.name !== "web"); // not runnable in-browser
  renderList("");
}

function renderList(q){
  const ql = q.toLowerCase();
  const groups = {};
  for (const t of tools) {
    if (ql && !(t.name.toLowerCase().includes(ql) || (t.description || "").toLowerCase().includes(ql))) continue;
    (groups[domainOf(t.name)] = groups[domainOf(t.name)] || []).push(t);
  }
  const el = $("#list");
  el.innerHTML = "";
  for (const g of Object.keys(groups).sort()) {
    const h = document.createElement("div");
    h.innerHTML = `<h4>${escapeHtml(g)}</h4>`;
    for (const t of groups[g]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cmd" + (selected && selected.name === t.name ? " active" : "");
      b.innerHTML = `${escapeHtml(t.name)}<small>${escapeHtml(t.description || "")}</small>`;
      b.onclick = () => { selected = t; renderList($("#search").value); renderForm(); };
      h.appendChild(b);
    }
    el.appendChild(h);
  }
  if (!el.childNodes.length) el.innerHTML = '<p class="empty" style="padding:0 8px">no matches</p>';
}

function renderForm(){
  if (!selected) { $("#pane").innerHTML = '<p class="empty">Select a command.</p>'; return; }
  const t = selected;
  const sch = t.inputSchema || {};
  const props = sch.properties || {};
  const req = new Set(sch.required || []);
  let fields = "";
  for (const [k, v] of Object.entries(props)) {
    const label = req.has(k) ? `${escapeHtml(k)} <span class="req">*</span>` : escapeHtml(k);
    const tip = v.description ? ` title="${escapeHtml(v.description)}"` : "";
    let inp;
    if (Array.isArray(v.enum)) {
      const opts = v.enum.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
      inp = `<select data-k="${escapeHtml(k)}"${tip}><option value="">(default)</option>${opts}</select>`;
    } else if (v.type === "boolean") {
      inp = `<input type="checkbox" data-k="${escapeHtml(k)}" data-t="bool"${tip} />`;
    } else if (v.type === "number") {
      inp = `<input type="number" data-k="${escapeHtml(k)}" data-t="num"${tip} />`;
    } else {
      inp = `<input type="text" data-k="${escapeHtml(k)}"${tip} />`;
    }
    fields += `<div class="formrow"><label${tip}>${label}</label>${inp}</div>`;
  }
  $("#pane").innerHTML = `
    <h2>${escapeHtml(t.name)}</h2>
    <p class="desc">${escapeHtml(t.description || "")}</p>
    <div id="ff">${fields || '<p class="empty">No parameters.</p>'}</div>
    <div class="flags">
      <label><input type="checkbox" id="f-full" /> --full</label>
      <label><input type="checkbox" id="f-yes" /> --yes</label>
      <label><input type="checkbox" id="f-dry" /> --dry-run</label>
    </div>
    <button class="run" id="run" type="button">Run</button>
    <div class="result" id="result"></div>`;
  $("#run").onclick = run;
}

async function run(){
  const args = {}, flags = {};
  document.querySelectorAll("[data-k]").forEach(el => {
    const k = el.getAttribute("data-k");
    const t = el.getAttribute("data-t");
    if (t === "bool") { if (el.checked) flags[k] = true; }
    else if (t === "num") { if (el.value !== "") args[k] = Number(el.value); }
    else { if (el.value !== "") args[k] = el.value; }
  });
  if ($("#f-full").checked) flags.full = true;
  if ($("#f-yes").checked) flags.yes = true;
  if ($("#f-dry").checked) flags["dry-run"] = true;
  $("#run").disabled = true;
  $("#result").innerHTML = '<p class="empty">running…</p>';
  try {
    const r = await fetch("/api/run", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ command: selected.name, args, flags }),
    });
    const data = await r.json();
    showResult(data);
  } catch (e) {
    $("#result").innerHTML = `<span class="badge bad">error</span><pre>${escapeHtml(String(e))}</pre>`;
  } finally {
    $("#run").disabled = false;
  }
}

function showResult({ envelope: env, exitCode }){
  if (!env) { $("#result").innerHTML = '<span class="badge bad">no response</span>'; return; }
  const cls = env.needs_human ? "warn" : (env.ok ? "ok" : "bad");
  const label = env.needs_human ? "needs human" : (env.ok ? "ok" : "fail");
  const badge = `<span class="badge ${cls}">${label} · exit ${exitCode}</span>`;
  const m = env.meta || {};
  const bits = [];
  if (m.duration_ms != null) bits.push(m.duration_ms + "ms");
  if (m.tokens_used) bits.push(m.tokens_used + " tokens");
  if (m.change_id) bits.push("change " + m.change_id);
  if (m.version) bits.push("v" + m.version);
  const meta = bits.length ? `<div class="meta">${escapeHtml(bits.join(" · "))}</div>` : "";
  const needs = env.needs_human ? `<div class="summary">⚠ ${escapeHtml(env.needs_human)}</div>` : "";
  $("#result").innerHTML =
    `${badge}<div class="summary">${escapeHtml(env.summary || "")}</div>${needs}` +
    `<pre>${escapeHtml(JSON.stringify(env.result, null, 2))}</pre>${meta}`;
}

$("#search").oninput = (e) => renderList(e.target.value);
init();
</script>
</body>
</html>
